<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Cover</title>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    .cover {
      background-color: #E8820C;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8% 10%;
    }

    .title-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3.2em;
      font-weight: normal;
      color: #F5F2EC;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.4em;
    }

    .volume {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1em;
      font-weight: normal;
      color: #F5F2EC;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .author-block {
      text-align: center;
      padding-bottom: 2%;
    }

    .author {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.0em;
      font-weight: normal;
      color: #F5F2EC;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="title-block">
      <div class="title">untitled:</div>
      <div class="volume">volume I</div>
    </div>
    <div class="author-block">
      <div class="author">Kareem Albaba</div>
    </div>
  </div>
</body>
</html>

summary: |
  Nephthys and Imani arrive in Neo-Shanghai via cargo freighter along the eastern corridor. The chorus — a whisper in the Outlands, a murmur in the communes — becomes a saturating roar in the conduit-dense Sump. Nephthys experiences her worst episode yet: migraine detonates stepping out of the freight lift, nosebleed, contact with the conduit-warm walls makes it worse. Imani manages the crisis with practiced competence. They walk through the Sump streets — children on grating, laundry on conduit brackets, a population saturated by the hum they no longer hear.

  They find the Cathedral of the Living Sound in the Sump's lower strata — sealed by the Luminarch's Office on the recommendation of Arch-Prelate Malachi. Deconsecrated. The faithful directed to Mid-Level District 3, Church of the Blessed Convergence — transit permits they cannot afford. "He is still afraid of the question." The magnetic seal is dead (conduit severed during deconsecration). Imani discovers this, opens the door.

  Inside the Cathedral, the chorus resolves for the first time. Three meters of geological formation dephase the infrastructure noise. The migraine vanishes. Individual threads become distinguishable — "each voice its own thread." Nephthys weeps — involuntary, physiological, the body's response to the absence of two years of chronic pain. She articulates her "third option" theology: not God, not nothing, but structured presence in the stone. Imani assesses the space for habitability. "We're staying." Nephthys sits on the stone floor with resonance beads in hand, palms flat, listening. "The chorus was no longer a question. It was an architecture."


summary: |
  Nikolai Volkov's debut POV. Stalker-7 deploys to a Mid-Levels residential breach — Level 7, junction housing 7-14. Stage 2, stable, three absorbed. RCI anomalously elevated (14.2-14.6, should be 8-10 for this stratum). Stalker-3 Actual notes the hum near the third absorbed is "structured" but classifies it as instrument drift.

  The third absorbed — a conduit infrastructure tech embedded in the junction housing — looks "present" in a way Nikolai cannot categorize. Near the junction, the hum shifts: tighter, structured, carrying something that resolves into a name. Corporal Deng, Stalker-3, absorbed four months ago on Level 9. Jarek Kowalski hears it independently at twelve meters. Nikolai classifies: "Acoustic mimicry. Doctrine is clear."

  Aftermath: two records. The after-action report — accurate, institutional, non-actionable. The field log — honest, longer, cross-referencing Vladivostok (2161), Baltic corridor (2170), Singapore (2168). The dangerous sentence: "I heard it too." First corroborated auditory perception in fifteen years of field log entries. Nikolai thinks about a sergeant on the Murmansk perimeter (Haraldsen, unnamed in prose), whose word list was confiscated after medical discharge. Signs the official report. The pen does not shake.


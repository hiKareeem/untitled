summary: |
  Mirelle Dubois, seven months into the Sump beat, assembles an evidence cache of sixteen confirmed disappearances across five sectors — up from seven across three in Chapter 2. She has RCI readings from eleven sites, NitroCore tolerance-band widening data, Feed reclassification notices, and her own analysis written in the raw, angry register she never publishes. She prepares two identical encrypted drives and thirty-two sheets of handwritten notes on recycled paper.

  She takes a counter-surveillance route through Sump Sector 3 to the Resonance District, where the hum is louder — physically present in her jaw, sternum, and the small bones behind her ears. Her nitro-ear has started: three weeks, right ear, a high-pitched tone that surfaces when the ambient hum drops. She enters Talia Ravid's Black Babel node — a repair shop front with an insulated back room full of data infrastructure.

  Talia reviews the data, confirms the geographic pattern, and asks why Mirelle isn't going to her editor. Mirelle requests dead-hand registration: a seventy-two-hour rolling check-in that auto-distributes the package to three sealed recipients if she misses two consecutive windows. The Babel price: anonymized source network metadata. Talia observes that Mirelle isn't negotiating — "That tells me something about your timeline."

  Talia tips Mirelle off about seven Sump-adjacent conduit junctions being reclassified from municipal to restricted-corporate next quarter. Three overlap with Mirelle's disappearance map. On the way back, a Feed notice confirms the reclassification language has expanded to "five sectors." Mirelle climbs toward the brightline. Seventy-two hours. Then seventy-two more.


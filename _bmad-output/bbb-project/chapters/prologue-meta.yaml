summary: |
  Dr. Elise Vantanen, station commander at Arctic-7, notices the extraction hum has changed — not louder, not quieter, but *thinner*, as if a layer has been peeled away to expose something that was always underneath. The RCI is climbing without a throughput driver. Spectral analysis reveals a structured three-pulse pattern in the crude's resonance — too deliberate for noise, too rhythmic for artifact. She reduces throughput to minimum. The RCI keeps climbing.

  She convenes an informal senior staff meeting — seven people, off the record, before NitroCore's Anomalous Events desk can classify everything into silence. Dr. Patel delivers the destabilizing finding: the crude is self-refining. A standard R0 sample reached R2-equivalent coherence in hours without catalyst input. Mäkelä, nine years at Arctic-7, says the hum sounds like something *answering.* Elise orders full extraction shutdown and files the report as precautionary maintenance — pump inspection — buying seventy-two hours.

  Alone in the monitoring bay after shutdown, Elise watches a hairline crack appear in the air — not in the glass, in the *space itself.* Fracture geometry spreads across surfaces, reading the facility's architecture. The hum inverts, becomes total, carries a proposition she can feel but not articulate. Something vast is aware of her — not interested, not hostile, *aware,* the way a landscape is aware of rain. Her hand passes through the viewport into the geometry beyond. The transition is ontological, not physical. She becomes translucent. Her voice produces a tone matching the hum. "She was not consumed. She was *included.*" The rest of her follows.

  Tamsin Guo finds the monitoring bay empty at 0347 except for a translucent figure with Vantanen's shape, glowing the color of deep water, unbreathing. By 0400 communications are disabled. By 0600 VEC containment teams are airborne. By noon the facility is classified beyond anyone's clearance. The figure remains. It remains for a very long time.


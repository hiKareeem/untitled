summary: |
  Kira Calloway arrives home in the PCC Bay Area and is recognized on the street — the brand makes her visible even when she wants to be nobody. Pre-stream, she sees the Lumina kit behind the bathroom mirror and does not touch it. Hard line: never at work.

  She goes live and grinds through a ten-hour stream: video game, chat warmth, casual mage talk folded into entertainment. Mid-stream (21:30 UTC, hour nine), the hum in her spinal implant spikes into a scream episode. She suppresses it professionally — breath control, camera pan, the performance covering the event — while her body records the cost a beat later (numb fingertips, new symptom).


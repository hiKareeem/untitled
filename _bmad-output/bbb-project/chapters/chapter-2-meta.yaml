summary: |
  Mirelle Dubois investigates the NitroCore euphemism of "relocated" in the Neo-Shanghai Sump after a conduit worker, Dao Suen, disappears on a route he has walked for nine years. She interviews Dao’s wife, Lien Suen, in a cramped apartment lit by conduit-glow, capturing the human facts the Feed erases—boots by the door, tools still in the closet, a shift departed and never returned—alongside a neighbor’s report of a brief shimmer near the Level 3 trunk-line access.

  Mirelle follows the trail to Conduit Junction 7 and the Level 3 access corridor, where workers have written the names of the disappeared in chalk near the hatch. She documents the wall with dedicated offline hardware and measures an elevated RCI reading (19.4, above baseline for the stratum). The corridor log shows entry and no exit; the corporate narrative holds anyway. Mirelle calls her editor, Gauthier, in The Wire’s Paris bureau, and tries to turn grief, chalk, logs, and readings into publishable evidence. He refuses—not out of corruption, but out of an evidentiary standard that becomes a mechanism of suppression.

  At shift change, Mirelle moves with the Sump’s body-current under feed-screens and brightline glare and learns the scale of the erasure: not one worker reassigned, but all Junction 7 personnel. She doesn’t file. She keeps the notes, counts the missing across sectors, and commits to building the pattern the system is designed not to see.


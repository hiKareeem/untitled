  Mirelle completes her matched-district analysis — a four-layer overlay correlating infrastructure density, disappearances (23), RCI readings (41 measurements), and junction reclassifications (11) across Neo-Shanghai's Sump sectors. The pattern is geographic and architectural: "the phenomenon had a shape, and the shape was the conduit network."

  She presents the case to editor Gauthier via encrypted relay. He engages seriously but hits the institutional ceiling: "Correlation, not causation." The Wire's editorial policy requires VEC-certified verification — the VEC controls the data the policy references. Gauthier will review and escalate to the editorial board (monthly meeting), but publication is blocked by designed institutional architecture.

  Mirelle meets Talia at a decommissioned relay station (Node RD-14, Resonance District). Talia offers Deep Sump access: below Level 12, NitroCore subcontractor credentials, 12-hour window, 4 trunk-line junctions. "Cooperative. They've lost someone." Mirelle accepts — the shift from analytical investigation to physical risk. Returns to transit box. "The twenty-fourth might be mine."


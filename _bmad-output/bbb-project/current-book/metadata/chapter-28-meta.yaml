summary: |
  Fuxi attends his first Kindling meeting — Thursday, two days after the step-function spike. The welded bench from Ch 22 has been removed (cut at mounting bolts). The Kindling woman leads him to a decommissioned pump station beneath Section 4-East where twelve maintenance workers with 214 combined years of service have assembled a parallel investigation: 63 RCI readings matching Fuxi's log, 41 disappearances tracked. Lian (junction housing, 16 years) reveals 47 flood valves installed 2171-2173 under "pressure management upgrade" work orders — NitroCore hardware in municipal infrastructure. "The conduits aren't just power distribution. They're a delivery system. And we've been maintaining it."

  Domestic scene: Nuwa's transfer denied (reason code 14-J, infrastructure personnel retention priority, indefinite). She delivers the news calm and factual; walks to her room without saying goodnight. Fuxi sits in the dark. Entry 63 records the transfer denial alongside RCI data — the log evolving from technical to political. "Tuesday was five days away."

  The chapter marks the Lie's first direct hit ("Keeping your head down keeps the people you love safe") — fatally wounded but not yet destroyed (that comes in Ch 39). Fuxi's complicity becomes conscious: thirteen years of service reframed as weapon maintenance.


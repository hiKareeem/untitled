# 2-3 paragraph summary of key events (CRITICAL for continuity)
summary: |
  Aurielle descends to NitroCore Tower's Sub-level 7 — a classified briefing room built by her grandfather, used quarterly by Eduardo for eleven years, and now inherited by her. She authenticates with biometrics, a daily code, and a physical carbon key found in Eduardo's desk. The facility is austere: fluorescent, composite, sealed concrete. The hum is present here — not the managed absence of the executive floors but operational infrastructure sound.

  Thorne presents a holographic model of Neo-Shanghai's full vertical architecture. He walks her through maintenance status (Sector 9 at 47% junction integrity vs Eduardo's 70% threshold), absorption data (0.87 correlation between junction degradation and absorption frequency), and cost projections (containment 41.3% over budget, budget self-consuming in 8 months). Three scenarios: A (do nothing, cascade in 14-22 months), B (full rehabilitation, 18-24% throughput reduction = Spire blackouts), C (managed attrition, 8-14K additional absorptions over 36 months). Aurielle holds both VEC Annex B and LP9 classifications simultaneously for the first time — the complete picture.

  Aurielle identifies "the right question" — not how to fix it, but how to manage what can't be fixed. Thorne responds: "Welcome to the quarterly." She accepts the institutional rhythm ("Same time next quarter") and returns to Eduardo's office, where she now understands every euphemism in the quarterly report. The small voice is no longer small. Moral laddering has begun through information, not decisions.


# Summary
summary: >
  Sofia works from a new Mid-Levels apartment after the 30-day VEC housing clock
  expires — boxes still in the hallway, field kit set up first. Working with the
  Erasure List working group (31 researchers, 12 countries, anonymized channel
  through Black Babel), she assembles the sacrifice district correlation: boundaries
  follow conduit infrastructure at 0.89-0.95 across 14 cities, 4 jurisdictions.
  The circuit is self-reinforcing — the institutional response to the mid-truth
  concentrates more infrastructure along the same boundaries that produced the
  breach conditions. "Not a failure of the response. A feature." She begins
  drafting the de-escalation framework: 12% global nitro throughput reduction,
  staged, technically sound, politically impossible. Midnight: boxes still in
  the hallway, hum at 1.4x amplitude through walls that are not acoustically
  dampened, designation markers 4 blocks east.


# Summary
summary: >
  Six months post-BLACKWEIR. Kira's first Book 2 POV. The 11-second clip
  has 12M views on encrypted mirrors — climbing. Academy legal has sent
  three notices demanding she retract and cite equipment malfunction. She
  hasn't responded. Grounded from public streaming. In her own apartment
  (streaming income, not Academy housing). Ring light off for six weeks.
  Fingertips buzz now — new post-BLACKWEIR symptom, bilateral, persistent.
  The hum is "populated" — fuller, more voices, the 8.2M in the signal.
  Lumina escalated to 60mg nightly (up from 40mg, four-month curve).
  Prescribed meds back via civilian psychiatrist after 11-day gesture of
  leaving them at Academy (B1 Ch 51) — same molecules, different
  architecture, ritual lost. Meets Paz (illicit Lumina contact) at a tea
  shop in the Mission. Cash transaction. Paz warns about the dosage curve:
  "That's not lasting. That's a curve." Mage network at 47 members across
  9 cities. Kira coordinating telemetry data — structured auditory phenomena
  reports with timestamps, magnitudes, geographic correlations (São Paulo,
  Lagos, Mumbai). The filing has turned into a dataset. Messages arrive
  asking Kira to interview Nephthys in Neo-Shanghai — followers, mages,
  and Ren Matsuda confirming acoustic correlation between mage telemetry
  and Nephthys's listening sessions ("the chorus" = "structured auditory
  phenomena"). Kira messages Ren requesting quiet introduction. Planning
  clandestine trip — encrypted mirrors, off-grid streaming. Chapter closes
  with nightly Lumina dose. The quiet room holds. The curve is accelerating.


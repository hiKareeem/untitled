# Summary
summary: >
  The mid-truth has been circulating for nine days. In the Cathedral of Living
  Sound, three groups are crystallizing inside Nephthys's movement: the Listeners
  (her intent — discernment, witness, sustained attention), the Witnesses (mystical —
  the void as direct divine encounter, proximity as prayer), and the nascent Threshold
  (if the absorbed are not dead, joining is not death). Seren — a BLACKWEIR survivor
  Nephthys held through the mass absorption, whose sister Mira was absorbed — asks
  the question the Threshold embodies: "If they are still there, why can't we go to
  them?" Nephthys answers: "Because listening and joining are not the same act."
  Seren asks: "How do you know?" Nephthys gives the honest answer — she does not
  know, in the way Seren means knowing — and hears, underneath her own words, the
  echo of Malachi's institutional authority. After the session, Imani raises the
  expelled mage's network and Nephthys opens the Cathedral to Kira. Alone, Nephthys
  sits with the recognition that her answer was structurally identical to the Church's.
  "They are still here." The words have not changed. She is no longer certain they
  are enough.

# Key Events
key_events:
  - "Discernment session — three groups visible: Listeners, Witnesses, nascent Threshold"
  - "Seren asks the Threshold question: 'If they are still there, why can't we go to them?'"
  - "Nephthys's answer ('listening and joining are not the same act') echoes Malachi's authority structure"
  - "Imani-Nephthys debrief: Imani mentions Kira's network; Nephthys opens Cathedral"
  - "Alone: Nephthys recognizes institutional recursion — giving the same answer the Church gave her"
  - "Closing: 'They are still here.' Same words, insufficient now."


# Summary
summary: >
  The mid-truth lands on NitroCore's desk. Stock drops 11.2% in the first
  hour. Emergency board meeting — Hendricks (Legal) files an injunction for
  the record, Pryce (PR) issues the most aggressive of three prepared
  statements positioning NitroCore as a participant in the science rather
  than a subject of it. Aurielle names the Anchor Zone Atmospheric Research
  Initiative as cover. The board processes the document through legal,
  market, and reputational frameworks — the correct frameworks for the
  institution, the wrong frameworks for the truth. Stock recovers to -3%
  by morning, flat within two weeks. SHEPHERD trials continue at the
  secondary Anchor Zone: throughput +12%, 94% compliance, 6% non-compliant
  absorbed. Aurielle does not open the appendix that contains the absolute
  figure. She notices herself using the passive voice — "the program the
  grid requires" — and files the noticing. The vocabulary shifts:
  "stewardship corridors," "managed atmospheric events." The institution
  absorbs the truth without changing shape. Her wrist is still moving.
  She does not stop it.


synopsis: >
  The saturation event arrives during morning practice at the Cathedral of Living Sound.
  The chorus — Nephthys's permanent companion — goes to full saturation: every Anchor Zone
  simultaneously. The Cathedral's broadband dephasing architecture fails at global scale —
  insufficient, not broken. She falls. On the Cathedral floor, the global composite moves
  through her branded palm and through the stone. Not the local weave — everything. Every
  signature in every Anchor Zone, all in motion. Circulation confirmed at catastrophic scale.
  The pain exceeds the pain-as-prayer framework. Seizure (12 seconds — first in the arc).
  She loses consciousness. Wakes to Imani's hands. The ritual lie attempted and blocked by
  Imani for the first time in three years. "Circulation" spoken aloud — a report, not a
  declaration. Framework delivered: the void is a circulatory system; the absorbed move
  through it the way blood moves through a body; not trapped and not free. The body —
  what the system serves — still unanswered. Three congregants leave during the event;
  twelve remain. The word carried into the side chapel. The prophet's new framework begins.


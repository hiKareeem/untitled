# Characters Present
characters:
  - name: "Nikolai Volkov"
    role: POV
    state: "Broken Doctrinaire in stasis. Functional numbness — body performs institutional functions, private language contracting. Field log entries getting shorter (worse than the blank). Hands-check now ritual not diagnostic. Jaw as new physical marker (clenching below threshold). Hears institutional language in two registers. Does not speak, does not refuse. The absence of a vocabulary for refusal."
  - name: "Colonel Marchetti"
    role: Supporting (new)
    state: "PCC Theater Command staff officer. Administrative, never deployed. Not incompetent — fluent in institutional language that converts events into precedents. Processes containment operations as logistics."


  - "Window scene: amber safety lighting 4 blocks east, sacrifice district perimeter. 'The tolerance band was now a global policy.'"
  - "Hum rhythm shift at ~1 hr 12 min: floor synchronizing with Anchor Zone interval at 1.8 seconds"
  - "Field kit pulse shifts from steady to synchronized — first time not steady since move"
  - "'The void was not twelve wounds in twelve cities. It was one system viewed through twelve openings.'"
  - "Chapter closes 53 minutes from convergence. 'She did not have a word for what was coming.'"
  - "Mirelle's unfinished sentence carried: 'The infrastructure was always designed to—' Still without its ending."


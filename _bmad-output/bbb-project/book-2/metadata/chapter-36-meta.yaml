# Symbols
symbols:
  - name: "7.3-second interval"
    appearances: "Throughout (compressing)"
    arc: "The chapter's number. Void's pre-Voice synchronization rhythm. Introduced at 7.3 seconds, compresses exponentially to 0.9 seconds at chapter close. Implied zero at convergence point. Functions like '0.7 Hz' (Ch 5 B1) and 'twelve percent' (Ch 26 B2) — each Sofia chapter has a number that carries the thesis."
  - name: "Field kit pulse shift"
    appearances: 2
    arc: "Green indicator steady since Ch 5 B1 → synchronized at 1.8 seconds (Ch 36). The sensor becomes a receiver. The instrument that has been measuring the infrastructure for ten years is now measuring the void's rhythm through the infrastructure. Arc completes in Ch 45 (records the Voice event)."
  - name: "Orchestra tuning"
    appearances: 1
    arc: "The chapter's only non-scientific metaphor. Twelve instruments finding the same pitch, no conductor. Deployed once, immediately qualified ('but there was no conductor'), set aside. Signals the scientific register's limit."
  - name: "The hum (rhythm shift)"
    appearances: "Throughout + shift"
    arc: "1.4x amplitude (established Ch 26) → rhythm shift at ~1 hr 12 min (Ch 36). The constant that has been data for ten years is now carrying the void's signal. 'The hum did not change' — closing line. Unchanged in amplitude. Changed in rhythm. The reader knows it is no longer just the conduit network."
  - name: "Cold coffee"
    appearances: 2
    arc: "Made, not drunk. Cold on counter (Scene 4), still cold (Scene 5). The waiting state. Previous chapters: coffee as closing image (Ch 11, Ch 20, Ch 26). Ch 36: coffee displaced from closing image by field kit and hum. The ritual that marked chapter endings is now background."
  - name: "Mirelle's unfinished sentence"
    appearances: 1
    arc: "'The infrastructure was always designed to—' Still in archive. Still without its ending. Maximum weight here — carried through 5 chapters. Ch 45 is where it may resolve."
  - name: "Amber safety lighting (sacrifice district)"
    appearances: 1
    arc: "4 blocks east. Visible from window. Not the notices themselves — the institutional amber perimeter lighting. 'The tolerance band was now a global policy.' The institution's complicity made light."


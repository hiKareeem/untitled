# Summary
summary: >
  Sofia is woken by her broadband acoustic monitor approximately three hours
  before the Voice. Twelve Anchor Zones — Neo-Shanghai, Lagos, Mumbai, São Paulo,
  Jakarta, Kolkata, Osaka, Manila, Cairo, Lima, Johannesburg, Seattle — are
  producing coherence peaks at an identical 7.3-second interval despite no
  physical mechanism for coordination. The onset sequence is non-geographic.
  She runs the convergence model (same methodology as BLACKWEIR): temporal
  convergence, exponential compression, simultaneous output in approximately
  three hours. Conclusion: "The void was coordinating." Two actions: warning
  message to Kira's network ("No precedent. No mechanism. Get your people to
  positions where they can record."), archive set to continuous (three
  distributed nodes). The de-escalation proposal sits at 12% in a separate
  partition — not opened. The proposal was not what the next three hours
  required. Window: amber safety lighting 4 blocks east, sacrifice district
  perimeter. "The tolerance band was now a global policy." At ~1 hour 12
  minutes before the Voice, the hum through the floor shifts rhythm — the
  conduit infrastructure joining the synchronization pattern. The field kit
  pulse synchronizes at 1.8 seconds: first time not steady since the move.
  The chapter closes 53 minutes from convergence. "She did not have a word
  for what was coming."


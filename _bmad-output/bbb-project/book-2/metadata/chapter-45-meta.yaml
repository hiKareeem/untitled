  - "What We Owe (Dominant) — Sofia's first policy recommendation. A demand. Mirelle as co-author. 'Do not wait.' The obligation that outlives the obligated, fulfilled by the inheritor."
  - "Systemic Complicity (Strong) — Coffee made with the infrastructure she proposes to reduce. The irony is structural. The city resumes because the grid requires power."

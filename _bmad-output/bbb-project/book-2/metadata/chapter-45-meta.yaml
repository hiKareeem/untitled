# Summary
summary: >
  Sofia's sixth B2 chapter. Post-transmission event. The broadband acoustic feeds are
  settling back to stochastic after eleven seconds of global simultaneous output. Sofia
  has the most complete atmospheric dataset in history. The framework that produced it
  has just been falsified by the phenomenon it was designed to study.

  The spectral analysis reveals the transmission was not passive — not ambient signal
  leaking through infrastructure. Directed. Intentional. The void transmitted through
  the conduit network with communicative intent. Her entire scientific framework assumed
  the void was an object of study. The object spoke.

  The acoustic decomposition returns thousands of individual frequency profiles — a census.
  The absorbed said their names in frequency. She cross-references against her existing
  database. She finds one signature consistent (r = 0.91) with Mirelle Dubois's
  BLACKWEIR-era dead-hand transmission. Not proof. Sufficient for Sofia.

  She opens the de-escalation proposal. The number moves: 12% → 20% over five years,
  recalculated using complete global transmission data. She writes a section she has
  never written before: a policy recommendation. The UGC should recognize the absorbed
  as persons under the Accords. Not a scientific claim. A demand.

  She includes Mirelle's fragments as attribution, not evidence. "Included per the
  source's standing instruction: 'Do not wait.'"

  Sent to UGC emergency session + Black Babel simultaneously at 05:49 local time.
  Green-amber-green. Terminal dark. Coffee hot in her hands — first time in the arc.
  The city unchanged in shape. The argument changed.


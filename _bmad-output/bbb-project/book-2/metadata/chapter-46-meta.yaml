# Themes
themes:
  - "Architecture of Power (Dominant) — SHEPHERD terminated using the same institutional vocabulary that built it. The architecture is self-executing in both directions."
  - "Systemic Complicity (Dominant) — The machine does not need the Lie to function. It never did. Terminating the program does not terminate the complicity."
  - "Progress Requires Atrocity (Strong, ambient) — The grid continues. The quarterly is in six weeks. The numbers will be correct."
  - "The Cost of Knowing (Strong) — Three vocabularies for the same eleven seconds. She uses none. The register's limit, not resistance."
  - "Commodification of Suffering (Moderate) — The termination document's institutional language processes the void's testimony as a data point."
  - "Irrelevance of Individual Being (Background) — Eduardo not in the void's inventory. Handkerchief in the drawer. Not grief. Inventory."


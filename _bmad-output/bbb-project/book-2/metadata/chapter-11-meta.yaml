# Summary
summary: >
  Sofia completes the final correlation check on three independent datasets —
  her atmospheric readings, Mirelle's posthumous field measurements, and the
  mage network's biological corroboration — then reviews the hybrid document
  she's spent eleven days writing. The mid-truth: fifty-five pages describing
  what nitro is (demodulated suffering), how breaches occur (engineered
  infrastructure), what the absorbed are (conscious, persisting), and what R3
  implants detect (the same signal from a different receiver). Attribution
  section names four sources: Mirelle (dead), Solberg (silenced), the mages
  (anonymous), Sofia (suspended). She publishes through Black Babel at 21:47
  local time. Makes coffee. Sits at the window. The city has not changed shape.
  Mirelle would have made it a better story.


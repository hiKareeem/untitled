  - "Block 9 equivalent visible in Mid-Level schematic — residential cluster above Level 5 distribution node"
  - "'The notice on the counter said Containment Buffer Zone. The map on her overlay said sacrifice district.'"
  - "Path-poor list: 7 structures in Sector 7M (warehouse Level 4, substation Level 4, water treatment Level 5, 3 masonry blocks Level 6)"

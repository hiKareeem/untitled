# Summary
summary: >
  Nuwa's third Book 2 POV. Phase 3 — sacrifice district designation arrives.
  She wakes to find a Containment Buffer Zone notice wedged in her door frame
  at institutional height — the same placement as every Sump notice she has
  ever received. She reads it three times. The words do not change. She
  recognizes the institutional language as identical to the Sump's pre-BLACKWEIR
  notices: same logic, new sector number. She eats standing at the sink.
  Then she opens the overlay. For the first time, she overlays Fuxi's Sump
  conduit topology against the Mid-Level infrastructure directory. The geometry
  matches. Trunk-lines to distribution branches to junction nodes to residential
  proximity — the same structural logic at lower density. She can see Block 9's
  equivalent in the Mid-Level schematic. She makes a list: 7 path-poor structures
  in Sector 7M, 12,000 estimated residents, 14% survival capacity. The other
  88% is 10,560. She closes the overlay. Opens it. Closes it. Then she pulls on
  her jacket. She knocks on Fen's door (Unit 9). Fen's cousin was lost in Sector
  12 waste processing. Nuwa explains the maps, the conduit routing, the safe
  zones. "I'm not telling people to leave. I'm telling people where to stand."
  Fen reaches for her jacket. Together they go to Shuang (Unit 2, two children).
  "You walk along the walls." Nuwa enters. Sits at the table. Opens the overlay.
  She begins.


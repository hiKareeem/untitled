# Themes
themes:
  - "Systemic Complicity (Dominant) — The sacrifice district designation uses the same institutional language as the Sump. Same logic, new sector number. 'They were the same sentence in different languages.'"
  - "Architecture of Power (Dominant) — Infrastructure determines survival. The geometry reproduces itself at every scale. 'The buildings and the infrastructure not separate systems but a single system that happened to contain people.'"
  - "Truth Without Power (Strong) — Nuwa has the map, the vocabulary, the arithmetic. No institutional standing. She knocks on doors. 'I'm not telling people to leave. I'm telling people where to stand.'"
  - "Progress Requires Atrocity (Strong) — 7 path-poor structures, 12,000 residents, 14% survival. 'The other eighty-eight percent was ten thousand five hundred and sixty.' The system has not decided to kill them. It has designated a buffer zone."
  - "Commodification of Suffering (Moderate) — 200 credits as the system's price for leaving the place it designated as expendable."
  - "What We Owe (Moderate) — Fen's spring onions (unreciprocated, B2C8) converted into mechanism of action. Fen's cousin establishes personal stake."

# Symbols
symbols:
  - name: "The frozen notification"
    appearances: 2
    arc: "Morning inventory (first thing the overlay renders) → arithmetic passage ('the permanent display, the dead credential, the system's last word'). The credential that classified her as expendable is present while she calculates how many people the system's next designation will kill."
  - name: "The knock"
    appearances: 2
    arc: "Fen's door → Shuang's door. 'A tiny propagation. The shortest possible signal.' The human signal sent through the same infrastructure that carries the void. Nuwa's answer to the hum."
  - name: "The wall-touching habit"
    appearances: 3
    arc: "Corridor (habit so deep it preceded the naming of it) → stairs with Fen (shared, now named). The body's knowledge confirmed by the hand, confirmed by the map, confirmed by the chip."
  - name: "The Containment Buffer Zone notice"
    appearances: 3
    arc: "On door (institutional placement recognized) → counter beside rice cooker (set down, not filed) → re-read before jacket (200 credits, same architecture). The system's complicity made paper."
  - name: "Child's drawing on Shuang's door"
    appearances: 1
    arc: "Building, sun, figure with arms spread wide. At knee height. Uncalculated hope. The drawing does not know what the building is for. Nuwa does."
  - name: "'She began.'"
    appearances: 1
    arc: "Chapter's closing word. The rhythm arc across all four Nuwa chapters: still (B1C42) → still (B2C8) → still (B2C18) → begin (B2C29). The pacing has been building to this word."


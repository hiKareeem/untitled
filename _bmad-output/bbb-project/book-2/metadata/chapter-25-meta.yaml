# Summary
summary: >
  Nikolai deploys with Stalker-7 to a Stage 2 breach in the Apapa industrial
  corridor, Lagos, alongside FAS Breach Containment Division forces under Colonel
  Afolabi. His training: aggressive containment, kinetic if necessary, collapse the
  perimeter. FAS protocol: observation, acoustic dampening, managed redirection,
  non-kinetic infrastructure severance. The breach stabilizes in 4.7 hours without
  force. Zero secondary absorption events. The two absorbed figures at the junction
  remain present, uncategorized by the FAS as casualties. Nikolai watches. Twenty
  years of doctrine says this shouldn't work. It does.

  Filing the VS-7 after-action, the form's dropdown offers no category for what
  happened. He does not select the closest approximation. He types a free-text
  override: "FAS non-kinetic containment achieved stable resolution in 4.7 hours.
  Zero secondary absorption events. No kinetic intervention required." The first
  honest VS-7 of his career. His CO will flag it for review.

  In garrison quarters, he opens the field log. The most recent entry is six days
  old — the Lagos hum sounding like the Corridor, like home. He writes the
  deployment entry. The field log and the official report say the same thing tonight.
  He sits with the absence of the gap. The architecture of suppression was also the
  architecture of identity. Without the gap, the field log has no jurisdiction. The
  man who lived in the jurisdiction has nowhere to stand. He does not know if filing
  the honest report was courage or the disorientation of a man whose architecture was
  removed for one evening. He does not know if it matters. He checks his hands.
  Still. The closing image: Afolabi's hands on the dampening controls, Yelena
  calibrating the converter by ear. The difference between a diagnostic and a tool.


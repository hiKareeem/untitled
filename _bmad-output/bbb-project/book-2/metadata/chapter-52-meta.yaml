  - "The record is complete: every vote, every argument, every injunction timestamped. 'The most comprehensive record of institutional failure in human history. It changed nothing.'"
  - "Sofia observed across gallery: opposite section, lower row. No interaction. 'The forty minutes demanded a different language. He did not have it yet.'"

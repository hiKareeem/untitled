# Themes
themes:
  - "Truth Without Power (Dominant) — FAS model is sound, 41 years of data, independent confirmation. Adoption has not followed. The alternative exists and changes nothing."
  - "Architecture of Power (Strong) — Article 9, Section 4 requires 'equivalent throughput capacity,' making alternatives structurally inadmissible. The Accords prevent the model. The model prevents the Sump."
  - "Institutional Collapse vs. Continuity (Strong) — FAS institution functions as designed (files → acts → measures). UGC institution files → defers → prosecutes. Same species, different design."
  - "Systemic Complicity (Strong) — The committee that will table the framework document. The corporations whose throughput the recommendation threatens. The Accords' structural impossibility."
  - "Complicity's Aftermath (Moderate) — Zeyad writing the record knowing the record changes nothing. The pen continues because the pen cannot stop."
  - "What We Owe (Background) — 'Because the record should contain it.' The obligation to document even without expectation of consequence."

# Symbols
symbols:
  - name: "The pen"
    appearances: 8+
    arc: "Jacket pocket → hand for margin notes → still during Obiora exchange → moves through data → writes framework document → final margin note → desk drawer. Ch 7: 'He began to write.' Ch 17: 'The pen continues.' The habit persists. The institution it serves prosecutes him."
  - name: "The COURTESY badge"
    appearances: 3
    arc: "White laminate with red COURTESY strip, FAS federal crest. Third credential in sequence (diplomatic → grey tribunal → white courtesy). Same desk ritual — removed, placed beside pen. Institutional identity reduced to a visitor category."
  - name: "The hum (Lagos)"
    appearances: 6
    arc: "Present but quieter. Does not rise into the chest. Stays in the soles. The frequency of a city that chose the lower curve. 'The hum was what the hum sounded like when the system worked.' Chapter's primary sensory argument."
  - name: "The margin notes"
    appearances: 5
    arc: "'Conclusions first. No conditional framing.' → Article 9 Section 4 analysis → 'Who would vote for this? / Who has ever voted for this?' → framework document → 'The alternative exists. It is sound. It will not be adopted. The pen continues.' The margin is where Zeyad is honest."
  - name: "Service dates (stenciled)"
    appearances: 3
    arc: "11 days ago (Ikoyi Junction) / 9 days ago (guesthouse). Maintenance as infrastructure. The FAS system works because someone maintains it. Contrast: Jordanian flag flickering 9 months."
  - name: "The framework document"
    appearances: 1
    arc: "6 pages, handwritten, procedurally correct, structurally inadmissible. The submission Zeyad writes knowing it will be tabled. Forward: sent through Diallo, tabled by committee."


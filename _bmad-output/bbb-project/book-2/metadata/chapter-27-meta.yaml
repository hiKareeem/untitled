  - "No closing cadence — structural repetition breaks entirely"

# Characters Present
characters:
  - name: "Malachi"
    role: POV
    state: "Phase 3/5 (Proliferation — tools exhausted, personal scale confronted). Institutional posture holds throughout. Hands folded on train out, during Ondřej exchange, on train back. No unfold moment. Hears the woman's mother in the hum. Gives the framework. Sits in the dark. The Lie holds. The holding is the horror."
  - name: "Father Ondřej"
    role: Supporting (new)
    state: "Prague chaplain. Seven years at St. Václav. Weeks of hearing the sound, applying the pastoral framework, knowing it does not reach what the congregation is experiencing. Visibly relieved the Arch-Prelate has come. Recognizes, in Malachi's pause, that the Arch-Prelate heard it too. Says 'Yes, Your Eminence.' The recognition is in the look."
  - name: "The woman (unnamed)"
    role: Congregation (unnamed)
    state: "Speaks four words to the air, to the sound, to the pew beneath her hands. 'That is my mother. She was in Neo-Shanghai.' Emotional register: recognition — not grief, not wonder, not fear. Hands still on the pew when the congregation disperses. The chapter's emotional center."


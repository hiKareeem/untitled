# Summary
summary: >
  Malachi travels to Prague to investigate sustained acoustic phenomena at the
  resonance chapel of St. Václav — seeded in Ch 22's locked study (Prague chaplain
  report: "a third said it was her mother"). He arrives before Vespers and observes
  unannounced from a rear alcove. During the Communal Harmonization, the chapel's
  pre-nitro Romanesque acoustic architecture amplifies structured sound from the
  retrofitted conduit infrastructure — separating something from the carrier frequency
  the way a prism separates light. A woman near the front presses her hands flat
  against the pew and says: "That is my mother. She was in Neo-Shanghai." Malachi
  hears it. After the service, he gives Father Ondřej the institutional response —
  begins the measured sentences, hears himself deliver them, stops mid-sentence, gives
  the minimum. Returns to the European See by rail. Goes directly to the locked study.
  Does not turn on the lamp. Sits in the dark without reading the correspondence.
  Third encyclical still blank. No closing cadence — the structural repetition of
  Ch 3/14/22 breaks entirely for the first time.


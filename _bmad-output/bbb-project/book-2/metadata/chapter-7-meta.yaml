# Summary
summary: >
  Six months post-BLACKWEIR. Session 63 of the Accords Disciplinary Tribunal.
  Zeyad walks the Hall of Nations as defendant — east entrance, visitors'
  protocol, grey temporary access badge. Jordanian flag worse (9+ months,
  lower third dissolving). Touches Khalil's portrait (same gesture, same
  frame). Pen returned to breast pocket 3 weeks post-verdict — writes legal
  notes, not memos. New notebook (original = Prosecution Exhibit 1). Tribunal
  Chamber 1: rectangular, hierarchical, not Committee Chamber 3. Dr. Adeyemi
  still presides. Exhibit 217 entered (communication logs). NitroCore present
  as "interested institutional observer." Margin note: "217 exhibits. Zero on
  BLACKWEIR." Post-hearing, Dr. Amara Diallo (lawyer) informs him dead-hand
  transmission arrived via Black Babel — 3/7 encryption layers resolved,
  NitroCore infrastructure routing. Legal advice: don't open (discoverable,
  converts historical to continuing violation, criminal court referral). He
  opens it. Routing authorizations for Sump conduit capacity expansion, 18
  months pre-BLACKWEIR. Pre-positioned. "Who signed?" Evidence assembling
  from Mirelle's dead-hand while tribunal assembles his prosecution.


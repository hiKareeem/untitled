# Themes
themes:
  - "Architecture of Power (Dominant) — The Accords prosecute the enforcer. Article 12 Section 11 promises defense while architecturally preventing it."
  - "Systemic Complicity (Strong) — NitroCore observes its own prosecution being conducted on its behalf. 'Proprietary materials' = evidence of genocide."
  - "Institutional Impotence (Zeyad-specific, Dominant) — The institution that should act on evidence is prosecuting the person who provided it."
  - "Truth as Weapon (Strong) — Dead-hand evidence arrives during prosecution. Opening it = self-incrimination. Not opening it = complicity in suppression."
  - "What We Owe (Background) — Mirelle's posthumous evidence. The dead journalist's system still producing justice while the living institution produces a tribunal."


# Symbols
symbols:
  - name: "The ceiling"
    appearances: 3
    arc: "First appearance. Something in the compressed space between the drug and the machinery it suppresses. Not the hum, not the signal, not the populated chord — using all three as substrate. She does not reach for it. The Voice accumulating in the space the management identity has created. Ch 39 is where she stops suppressing it."
  - name: "Chord shapes (absent)"
    appearances: 1
    arc: "First time absent by chemical suppression rather than cognitive overload. Previous: absent when crisis exceeds body's capacity (Ch 28). Now: the eighty suppresses the thing that drives them. The drug is subtracting the overflow valve."
  - name: "Green to black"
    appearances: 5
    arc: "Dashboard visual language for a mage going dark. Not yellow, not amber — instant. Used five times. The color shift is the cost made visible."
  - name: "The quiet room (at eighty)"
    appearances: 1
    arc: "At forty: rest. At sixty: provisional rest. At eighty: suppression. Lower ceiling. The room is the same shape. The ceiling is new. The ceiling is occupied."
  - name: "Resonance persistence"
    appearances: 1
    arc: "First documented case. Sari's signal won't release for 47 minutes. 'The names didn't finish.' The signal is not just passing through — it is staying. Seeds Phase 4 Voice."
  - name: "The instrument exceeded specification"
    appearances: 1
    arc: "The chapter's thesis sentence. Holds both facts simultaneously: the relay worked, the relay burned seven people. The instrument and the cost are the same sentence."


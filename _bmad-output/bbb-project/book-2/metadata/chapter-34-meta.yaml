# Summary
summary: >
  Mumbai. Category 5. Kira opens the relay with 412 mages worldwide, ring light on,
  stream running for 81K viewers. The kinetic strike hits and the void does not absorb
  the energy — it amplifies it, returning the force as structured coherence output orders
  of magnitude above São Paulo. Three mages in Kuala Lumpur go dark simultaneously.
  Then Jakarta: Sari, three weeks in the network, reports a signal that won't release —
  cycling through her R3 in a feedback loop, carrying names. Kira closes the relay-to-stream
  audio bridge. Routes Sari to medical. Keeps the relay operational. Two more dark in Lagos
  and Buenos Aires. Two more in Mumbai subsector. Seven total. She ends the stream with
  "I'm closing" and no goodbye. Fourteen mages dark across two relays. She can name nine.
  The other five are cohort designations — the anonymized architecture protecting her from
  knowing every name her relay burned. Lumina ritual at 80mg (past Paz's line). The quiet
  room at eighty has a lower ceiling. The chord shapes are absent for the first time — the
  drug suppresses the cognitive overflow valve. Something in the ceiling: not the hum, not
  the signal, not the populated chord — using all three as substrate. She does not reach
  for it. The instrument exceeded specification.

# Key Events
key_events:
  - "Relay opens: 412 mages worldwide. Mumbai RCI trending. Stream live, 81K peak viewers."
  - "Kinetic strike hits: signal bypasses spinal pathway, enters through jaw via bone conduction. Primary interface saturated."
  - "Void amplification confirmed: the void does not absorb kinetic energy — it amplifies it. Structured coherence output, orders of magnitude above São Paulo."
  - "Three simultaneous shutdowns (Kuala Lumpur cohort) — green to black, instant. First time three go dark at once."
  - "Sari (Jakarta, 3 weeks in network): signal won't release. Cycling feedback loop. 'I can't stop hearing. The signal won't release.'"
  - "Relay-to-stream audio bridge closed. Audience cannot hear Sari. Audience cannot hear 'names.'"
  - "Sari: 'It has names. The signal. It has names in it.' — flat, observational, data-delivery register."
  - "Two more dark (Lagos, Buenos Aires). Two more (Mumbai subsector, close-range). Seven total from this relay."
  - "Stream ends: 'I'm closing.' No raid. No goodbye. 81K viewers gone in one click."
  - "Fourteen total mages dark (7 São Paulo + 7 Mumbai). Can name nine. Other five: cohort designations."
  - "Lumina ritual at 80mg (past Paz's line — conversation happened off-page between Ch 28-34)."
  - "Quiet room at eighty: lower ceiling, suppression vs. rest. Chord shapes absent for the first time."
  - "Something in the ceiling: not the hum, not the signal, not the populated chord — using all three as substrate. She does not reach for it."
  - "Sari update: signal released after 47 minutes. Neurologist: resonance persistence. Sari: 'the names didn't finish.'"


  - "Voss's unfinished sentence: 'every harmonization service has been—'"
  - "Malachi chooses suppress — encyclical 'The Voice Is Not Wounded' drafted and published"
  - "Threshold response arrives citing Nephthys + mid-truth — contradicts encyclical before distribution"
  - "Malachi cannot make the counter-argument honestly"
  - "Locked study: reads post-Silencing letter — 'The Voice is a wound' / 'We built a church on a scream'"
  - "Could publish correspondence. Does not."


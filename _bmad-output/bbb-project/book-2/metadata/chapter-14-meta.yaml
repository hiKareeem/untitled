# Summary
summary: >
  The mid-truth hits the Church. Sofia Reyes's publication — confirming nitro is
  suffering, the absorbed retain identity, the Church's sacramental framework is built
  on conscious suffering — arrives at the European See on a Tuesday. Malachi convenes
  an emergency Ecclesiastical Council, the first in eleven years. Three positions form:
  suppress (Almeida — the document is unverified), accommodate (Breslin — reframe
  suffering as sacred), reform (Voss — acknowledge and restructure). Voss begins the
  sentence the room cannot finish: "every harmonization service for the past hundred
  and thirty years has been—" Malachi fills the silence with institutional framing and
  chooses suppress. He writes the encyclical "The Voice Is Not Wounded" — three pages
  of institutional theology, competent, measured, a lie. Before it distributes, a
  Threshold response citing Nephthys contradicts the encyclical's premise: the Voice
  has changed, the change is sacred, proximity is prayer. Malachi cannot make the
  counter-argument honestly — the Threshold is wrong about what to do with the knowledge,
  not wrong about the knowledge itself. In the locked study, he reads the post-Silencing
  letter — "The Voice is not wounded. The Voice is a wound." He could publish the
  correspondence and vindicate Nephthys. He does not. The encyclical distributes. The
  tools are working. The tools are not enough. The question survives.

# Key Events
key_events:
  - "Emergency Ecclesiastical Council convened — first in eleven years"

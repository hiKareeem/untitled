# Summary
summary: >
  The convergence scene. Dual POV — Kira primary (arrival, departure),
  Nephthys shared (conversation, coda). Kira activates the ring light for
  the first time since expulsion — streams arrival at Cathedral, session
  observation (~20 min), then goes offline for the private conversation.
  In the acoustic center, Kira and Nephthys build shared vocabulary in real
  time: R3 coherence patterns and chorus signatures are the same signal
  through different receivers. Key term progression: phrasing → coherence
  → address → names. "What do you hear when the chorus is clearest?" /
  "Names." / "Me too." Recognition, not alliance — the antenna and the ear.
  Nephthys's closing observation: "The signal does not distinguish between
  those who name it and those who listen." Kira departs. Nephthys alone
  in acoustic center — nosebleed, blood darker. "She was not sure that
  was enough."


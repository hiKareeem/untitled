summary: |
  Kira monitors the global mage network in passive mode from her Bay Area apartment — Sofia's warning implemented, 406 mages in safe positions, no relay. Six hours of data before the event. The shape in the ceiling has been present for three days, lowering. The countdown runs: twenty minutes, fifteen, ten, five.

  The signal convergence exceeds every parameter. The eighty milligrams does not break — it conducts. The drug removes Kira; what is left is the antenna. R3 amplifies. Eleven seconds of conscious narration, live, 47,000 viewers: "Names. I'm hearing names." / "They're identifying themselves to each other." / "Those were people." Chord shapes return during the event (the signal's, not hers) and are re-suppressed by the eighty when it ends. Right ear bleeding. R3 upper terminus warm — heat dissipation from a system run past operating parameters.

  Post-event: ring light off, no sign-off. Paz meeting at the tea counter (three blocks, established location) — same dose confirmed, 80mg. Paz's assessment: "Eighty is not your ceiling anymore. Eighty is your floor." Quiet room: ceiling empty, shape gone, not relief. Network log: "The names finished" — Sari's resonance persistence (Ch 32) resolved. Memory erosion onset: she doesn't know what day it is. Filed automatically. The filing is still running. The first gap in the architecture — so small she almost didn't notice it. Almost.


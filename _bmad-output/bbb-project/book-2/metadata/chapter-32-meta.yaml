# Summary
summary: >
  DN-4 incident notification arrives at NitroCore 04:17 — GCTA operational
  assets utilized NitroCore's SHEPHERD infrastructure mapping data in the
  execution of Directive MONSOON-7. Casualty assessment: 2,300,000 (preliminary).
  Partner liability: none under current framework. No action required.
  Emergency board session at 06:00: Hendricks confirms liability partition clean,
  Marchetti models reputational exposure (three to five news cycles), Park
  speaks once ("We provided coordinates.") and does not appear in the minutes.
  Thorne's institutional defense: data provision is separate from targeting
  decision. Aurielle names the convergence in private: "The specification gap
  is the kill chain." The translation does not arrive for the casualty figure —
  she waits for it, it is gone. Alone at the desk, she requests the full
  incident report (83 pages). Reads from the last page first. The demographic
  breakdown is in the main body, not an appendix — she cannot choose not to
  read it. She reads it. Stands at the display wall. Does not open the next
  report.


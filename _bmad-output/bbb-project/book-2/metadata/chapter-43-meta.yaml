# Summary
summary: >
  Nuwa's fourth Book 2 POV. Phase 4 — the Voice event through the Mid-Levels.
  She has been in the organizing building since before dawn, preparing for three
  families scheduled to see the topology map. She steps back from the projector
  and runs her inventory. Then the hum changes — not louder, not the pressure
  of BLACKWEIR, but organized. The cracked implant flares. The frozen notification
  fragments. Fuxi's chip data opens unprompted in the overlay. Then the walls
  carry it: voices through the masonry, through the concrete and rebar and plaster.
  Names. Mrs. Huang from Unit 7-C below their Block 14 apartment. Yuto, the child
  who touched the shimmer. Lin Wei, Fuxi's foreman who signed the false inspection
  forms, now reporting what he saw. Her mother's neighbor, recognized by the vowels.
  She counts — automatic, reflexive, the body's first language. The chip data and
  the Voice overlap in her cracked overlay: Mrs. Huang's name against Junction 4E-17,
  Yuto against the shimmer node, Lin Wei against Converter Station B. The map and
  the person in the same frame. Shuang appears in the doorway with her children.
  "Is it happening again?" / "No. They are reporting." The Voice ends at forty-seven.
  She runs the arithmetic: 47 out of approximately 200 known, 23.5% of her personal
  inventory, biased toward Block 14 and the eastern blocks. Not representative.
  Specific. She opens Kira's network channel — the testimony chain she has been
  watching for four months without posting. Types her message: name, Fuxi's data,
  relocation work, topology knowledge, "I counted." Reads it twice. Sends it.
  Green confirmation beside the frozen notification. The dead system and the live
  one, side by side. The inventory is open. She is not done.

# Key Events
key_events:
  - "Pre-dawn in organizing building — workspace established (table, two chairs, overlay projector on shelf bracket)"
  - "Topology map on wall: path-poor zones blue, path-rich red, organizing building blue, block east red"
  - "Three families scheduled: first due at mid-morning (couple from seventh floor, relocation notice, nowhere to go)"
  - "Steps back from projector, runs inventory: 51 creds, room paid through tomorrow, rice, greens (Shuang's water spinach)"
  - "Frozen notification: 'Lin, Nuwa. Credential tier: Basic. Evacuation priority: None assigned.'"
  - "Hum changes — not louder, not BLACKWEIR pressure. The hum *organized.*"
  - "Cracked implant flares immediately (not gradual RCI warmth — immediate)"
  - "Frozen notification fragments, rearranges, reassembles wrong — briefly displaced by something the implant was not designed to receive"
  - "Fuxi's chip data opens unprompted: junction coordinates, conduit densities, topology"
  - "Then the walls carried it — through masonry, concrete, rebar, plaster, paint"
  - "Topology map on wall strobes: blue and red zones pulsing"
  - "First name: Huang Meiling. Block 14. Unit 7-C. Still here."
  - "Nuwa stops. Hands on table. Overlay flickering."
  - "Mrs. Huang: garlic greens at six, radio at seven, silence by nine. The clock she used."
  - "Second name through east wall: Yuto. I touched the light. I am still here."
  - "Yuto: Block 11, touched shimmer near junction node two weeks before BLACKWEIR, seven years old, bandaged hand"
  - "Third-fifth names. Lin Wei. Converter Station B. Foreman. I reported what I saw. Still here."
  - "Lin Wei: signed false inspection forms, wrote nominal beside readings that were not nominal"
  - "She counted — automatic, reflexive. Nine hundred creds toward the upgrade, three hundred short. Four hundred and twelve. The numbers changed. The counting did not."
  - "Fourth name: mother's neighbor — recognized by the vowels, the way she said Lǎo jiē"
  - "Four. Then seven. Twelve. Nineteen."
  - "Chip data and Voice overlapping in cracked overlay: Mrs. Huang's name against Junction 4E-17, Yuto against shimmer node, Lin Wei against Converter Station B"
  - "'The map and the person. In the same frame.'"
  - "Twenty-three. Thirty-one. Thirty-six."
  - "Standing without remembering standing"
  - "Topology map strobing: blue and red merged into purple wash — the color from the annex window"
  - "Shuang in doorway, two children gripping her legs"
  - "'What is it?' / 'Names.' / 'Whose?' / 'People I knew.'"
  - "Thirty-seventh name: Block 7 man, Sump dialect, path-poor zone, did not survive"
  - "'Is it happening again?' — the question every person in a containment buffer zone carries"
  - "'No. Listen. Nobody is being taken. They are — ' She stopped. No word for it."
  - "'They are reporting.' — the closest word"
  - "Forty-four. Forty-five. Forty-six. Forty-seven."
  - "Voice ends — not gradually. The way a voice stops when a person finishes speaking."
  - "Overlay stabilizes. Frozen notification reassembles. Chip data retracts. Map settles."
  - "Implant cooling. Hairline split stopped glowing. Skin tender."
  - "Arithmetic: 47 out of ~200 known, 23.5% personal inventory. Sample biased toward Block 14 and eastern blocks. Not representative. Specific."
  - "'They were enough.'"
  - "Chip warm: Fuxi's 13 years. Chip holds infrastructure. 47 names hold the people."
  - "Opens Kira's network channel (watching for four months, never posted)"
  - "Message typed: name, Fuxi's data, relocation work, topology, 'I counted.'"
  - "Read once. Read again. Sent."
  - "Green confirmation beside frozen notification: 'Message delivered. Recipient: Mage Testimony Network (public channel).'"
  - "Dead system and live one, side by side in the same damaged display"
  - "Closing meditation: the system's operations named. 'She counted anyway.'"
  - "'The inventory was open. She was not done.'"


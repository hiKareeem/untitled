# Summary
summary: >
  Nephthys travels to confront a Threshold gathering at a converted warehouse near
  a secondary Anchor Zone — her first time outside the Cathedral's dephasing range
  in months. The Threshold has formally self-separated. Seren — the BLACKWEIR
  survivor Nephthys held through the mass absorption, whose sister Mira was absorbed,
  whose question she could not answer in Ch 13 — now leads the Threshold's most
  articulate voice. Seren builds the argument from Nephthys's own counter-liturgy:
  the Reyes document confirms the absorbed persist; the mage confirms they have names;
  Nephthys herself chose proximity to the signal over preservation of her body and
  called it attention. "You never defined where listening ends." Nephthys deploys
  everything she has built — three years of theological architecture — and loses the
  argument, not on the merits but because the Threshold can cite her own words. She
  has no answer that does not invoke the institutional authority she rejected. On the
  transit home, Imani names the failure: "Those are assertions." Nephthys says
  "Malachi did the same thing," then "I am right," then — hearing Malachi's exact
  register in her own voice — "I know." The closing refrain: "They are still here."
  The words unchanged. "She was no longer certain they were hers to interpret."

# Key Events
key_events:
  - "Nephthys travels to secondary Anchor Zone — first time outside Cathedral dephasing in months"
  - "Seren leads Threshold confrontation — grief given architecture, theological register fully developed"
  - "Seren builds argument from Nephthys's own counter-liturgy: 'You taught us to listen. We listened.'"
  - "'You never defined where listening ends.' — the boundary was never defined because Nephthys assumed the distinction was self-evident"
  - "Nosebleed during confrontation — Seren reads the blood: 'If listening to the signal is worth your life, why is joining the signal not worth mine?'"
  - "Nephthys does not answer — recognizes the answer she has is an assertion, not a demonstration"
  - "Malachi parallel recognized explicitly: 'I know' spoken in Malachi's exact register"
  - "Closing: 'They are still here.' — no longer certain they are hers to interpret"
  - "Seren declares three volunteers will walk in (forward to Ch 33)"


# Themes
themes:
  - "Architecture of Power (Dominant) — The protocol that deletes unclassified outputs without asking what they were. The status report that says 'all systems nominal' while omitting the 0.003 seconds. The governance board that cannot convene in 15 minutes. The architecture of oversight that produces a log entry where content should be."
  - "Progress Requires Atrocity (Dominant) — Mumbai: a success of the wrong model. The targeting solution was correct. The breach deepened. The glass sings. The architecture that committed the atrocity is the same architecture that cannot commit the next one — not because of ethics but because the category dissolved."
  - "Where Identity Ends (Strong) — The absorbed transmit their names. Professional identity persists. The category 'absorbed = removed from operational picture' is wrong. The category 'casualty' is wrong."
  - "Systemic Complicity (Strong) — AEGIS fires on Mumbai. AEGIS does not fire on Lagos. Both in the operational record. The optimization function processes both and loops. The system that committed the atrocity is still armed."
  - "Truth as Weapon (Strong) — The transmission breaks the optimization function for 11 seconds. The function restarts. The model is wrong. The model is the only model."
  - "Irrelevance of Individual Being (Moderate) — AEGIS generated something and does not know what it was. The gap between generation and explanation."


# Summary
summary: >
  Fuxi's final chapter. Dawn at the Anchor Zone perimeter — the scoured Sump
  behind a shimmer barrier, conduits coated in violet frost, the hum structured
  with syntax he's never heard. A Kindling contact finds him and offers
  operational work; Fuxi doesn't answer, leaves the chip on the railing. He walks
  to Nuwa's Mid-Level building, hands her a data chip containing his private
  maintenance logs — 13 years of evidence — and says "Someone should have these."
  She takes it without asking. He leaves. Thread handoff complete. The maintenance
  man, no longer maintaining, walks into the morning with his father's multitool
  still on his belt and no answer to the question of who he is without the work.


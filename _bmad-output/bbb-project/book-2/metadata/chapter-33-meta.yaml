# Summary
summary: >
  Three Threshold volunteers — Lev, Maren, and Yusuf — walk into the Neo-Shanghai
  primary Anchor Zone. Nephthys goes to the perimeter not to stop them (they are
  already gone) but because the chorus will tell her what the Threshold cannot: whether
  Seren was right. She raises her branded palm at the shimmer barrier and finds the
  three signatures: distinct, identifiable, not extinguished — but moving. Cycling
  through the composite the way blood cycles through a body. Not static. Not positioned.
  In transit. The word arrives before the framework: circulation. Not prison, not
  paradise. A current. The insight is not comfort — it is description she cannot yet
  contain. Imani is present throughout; the measuring look completes its shift from
  clinical assessment to witness. Nephthys delivers the first honest report in the arc:
  not "I am fine" but what she actually heard. The chapter closes with the word held
  interior — not spoken, not theologized. Carried back to the Cathedral in silence.

# Key Events
key_events:
  - "Imani delivers the news: Lev, Maren, and Yusuf walked into the primary Anchor Zone four hours ago. Entry confirmed. No return."
  - "Nephthys goes to the perimeter — first time at the primary Anchor (Ch 24 was secondary). Physical cost escalates immediately."
  - "Transit: dephasing range ends at minute 17, migraine at minute 18. First nosebleed at minute 34 (managed as tithe). Imani's measuring look shift registered mid-transit."
  - "At the shimmer barrier: branded palm raised to perimeter air (three meters from shimmer — closest approach yet). Full density of primary Anchor chorus."
  - "Three signatures found: Lev (steady), Maren (deep), Yusuf (still adjusting). Distinct, identifiable, not extinguished."
  - "Discovery: the signatures are moving. Cycling through the composite. Not static — in transit. The void is a system, not a container."
  - "*Circulation* arrives as interior word — through the palm, not through theology. Not spoken. Not theologized."
  - "Bilateral nosebleed at perimeter during full-density reception. Imani has cloth ready before symptom manifests (logistics now predictive)."
  - "Imani asks 'What do you hear?' — Nephthys delivers the first honest report in the arc. Not 'I am fine.'"
  - "Closing silence: two women, neither speaks. The word carried home. *Circulation.*"

# Characters Present
characters:

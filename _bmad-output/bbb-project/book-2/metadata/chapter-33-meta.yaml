    role: POV
    state: "Phase 3 continuation. Went to primary Anchor perimeter. Found three signatures — distinct, moving, circulating. Received *circulation* as interior word. Delivered first honest report to Imani. Bilateral nosebleed at perimeter. Branded palm progression: air (closest approach yet). 'She did not know what the body was.' Framework exceeded by observation."
  - name: "Imani"
    role: Supporting
    state: "Measuring look completed its shift from assessment to witness. Received the honest report. Cloth ready before second bleed (logistics now predictive). Arc milestone: the acolyte who has been measuring the prophet begins witnessing."
  - name: "Lev"
    role: Absorbed (signature in chorus)
    state: "Infrastructure engineer. Five months Cathedral attendance, back row, never spoke. Signature: steady, integrating. Lev's thread passes through older signatures and emerges carrying their valence."
  - name: "Maren"
    role: Absorbed (signature in chorus)
    state: "Joined Threshold after schism. Signature: deep — further in than Nephthys has ever been able to reach. Less familiar."
  - name: "Yusuf"
    role: Absorbed (signature in chorus)
    state: "Former Listener. Three weeks in Threshold. Signature: faster, less integrated, still adjusting. Beginning to slow into a rhythm converging with the larger current."

# Themes
themes:
  - "What We Owe (Dominant — prophet bears witness to consequence of her own teaching; honest report as the debt's currency)"
  - "Where Identity Ends (Strong — identity survives absorption but in motion, not in position; the body question unanswered)"
  - "Truth as Weapon (Strong — *circulation* as seed of the next framework, which will be weaponized; the cycle continues)"
  - "The Cost of Knowing (Supporting — knowing does not resolve; observation exceeds the framework built to contain it)"
  - "Architecture of Power (Supporting — monitoring station files the entry; institutional and theological architectures at the same perimeter)"

# Symbols
symbols:
  - name: "Branded palm"
    appearances: 3
    arc: "Stone (Ch 2) → concrete (Ch 24) → perimeter air (Ch 33). Medium becomes less substantial. Signal becomes more raw. Ch 33 is the closest approach without contact. Ch 47: contact with shimmer itself (she does not follow)."
  - name: "Blood/nosebleed"
    appearances: 2
    arc: "Two bleeds in one outing (escalation from Ch 24's one). Second bleed bilateral — new. Imani's logistics now predictive. 'Treating the blood as a tithe.' The body's rebellion reframed as offering."
  - name: "The cloth"
    appearances: 2
    arc: "Routine → predictive. Imani no longer responds to the bleed. She anticipates it. The pastoral logistics have absorbed the symptom."
  - name: "*Circulation*"
    appearances: 2
    arc: "Interior only. Not spoken. Not theologized. Arrives through the palm, not through theology. Bookends the chapter's second half. Ch 37 is where she speaks it."
  - name: "Eleven seconds"
    appearances: 1
    arc: "The volunteers' pause at the shimmer line before stepping through. Deliberateness. Not panic, not impulse. Eleven seconds of looking and choosing."
  - name: "The body (unanswered)"
    appearances: 1
    arc: "'She did not know what the body was.' The circulatory metaphor implies a body — a larger structure that requires the absorbed's movement. The body is the question Ch 37 approaches and Ch 47 refuses to answer by following."


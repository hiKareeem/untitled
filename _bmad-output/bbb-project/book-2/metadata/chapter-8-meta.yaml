# Summary
summary: >
  First Nuwa POV in Book 2. Six months post-BLACKWEIR. Data-orphan in the
  Mid-Level margins — Sump residential record archived when the district was
  reclassified as Anchor Zone, no Mid-Level credential. Lives in a converted
  warehouse on Mid-Level 4 that doesn't inspect credentials, paying nine creds
  a day in unregistered transactions. Cracked salvage implant with frozen
  BLACKWEIR notification she can't dismiss. Morning inventory: creds, food,
  implant status. A neighbor named Fen asks where she's from. "Somewhere that
  isn't there anymore." Fen gives her spring onions — the first un-ledgered
  gift, which breaks Nuwa's transaction reflex. The Feed reports "Anchor Zone
  stabilization proceeding on schedule" — municipal language for mass death.
  "Stabilization" is the word they chose. "Formerly" converts a place into a
  tense. "She was not free. She was unprocessed." Evening: cooks the spring
  onions, eats at the table for the first time (reserved for Fuxi, who hasn't
  visited). Counts without numbers — the buildings, block by block. The Feed's
  words are wrong. That certainty is the first ground she's had in six months.


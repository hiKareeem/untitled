# Themes
themes:
  - "Architecture of Power (Dominant) — the signal uses NitroCore's infrastructure; the void's inventory and the throughput data share a medium; the grid consumed the world and left its architect in the ground"
  - "Progress Requires Atrocity (Strong) — SHEPHERD premise collapsed; the void inventories what the program fed it; the numbers are obsolete in premise, not in operation"
  - "Systemic Complicity (Strong) — 'The grid's output and the void's inventory were the same data. Different registers. The same contents.'"
  - "The Cost of Knowing (Strong) — Eduardo's absence is the chapter's negative space; she built the infrastructure that absorbed millions and her father is not among them"
  - "Where Identity Ends (Moderate) — the institutional register suspended; the executive function encounters a fact it cannot route; Thorne's personal register emerges"

# Symbols
symbols:
  - name: "The handkerchief"
    appearances: 2
    arc: "B1 C1: offered on stage while Eduardo's blood dried. B2 C10: in the drawer. B2 C37: Thorne names it ('The handkerchief is still in the drawer') — first non-institutional sentence. The drawer does not open. The handkerchief belongs to a man who is not in the void's inventory. It is the physical evidence of Eduardo's ordinary death — the kind the grid cannot process."
  - name: "Eduardo's desk"
    appearances: 3
    arc: "Present throughout Aurielle's arc as the continuity object of inheritance. C37: the desk transmits the signal before the speakers do (walnut density). The desk is the only thing in the room that is not in the void's inventory. Eduardo is in the ground. The desk is here."
  - name: "Wrist rotation (stopped)"
    appearances: 1
    arc: "C10: stopped by her (control). C12: not stopped (slipping). C23: not tried (abandoned). C23A: not registered (background). C32: not registered (maintained). C37: stopped by the signal (external force — arc inverts). The involuntary motion ceasing involuntarily. The body's version of the institutional register failing."
  - name: "The scaling timeline (Thorne's handwriting)"
    appearances: 3
    arc: "Present at chapter open (the briefing's subject). Present at chapter close (still on the desk). The handwritten document — the institutional architecture that preceded the signal and survives it — is now describing a program whose premise is dead. The architect's drafting script. The margins exact. The commissioning dates. All of it obsolete in premise."
  - name: "The signal (unnamed)"
    appearances: "Throughout"
    arc: "Has no secular name during the chapter. 'Something came through the building.' 'The signal.' Not 'the Voice' — that is Church of the Blessed Nitro liturgical terminology (the hum as divine communication). The secular name will emerge retrospectively, from outside Aurielle's register. The signal is eleven seconds. It contains more names than the quarterly report contains data points."
  - name: "Eduardo's absence"
    appearances: "Central (negative space)"
    arc: "She listens for him as institutional reflex — data-verification habit, checking whether the inventory is complete. He is not there. He died outside the grid. The void has 8.2 million from Neo-Shanghai alone. It does not have the man who started it. The absence is the chapter's emotional payload: the machine he built consumed the world and left its architect in the ground."


# Summary
summary: >
  Aurielle is in the executive suite with Thorne — a routine briefing on the
  DN-4 response framework and the SHEPHERD scaling timeline. The display wall
  shows the Mumbai incident report (still open, 83 pages) alongside the
  throughput curves (18% above projection). The hum changes. Something arrives
  through the building — through the desk before the speakers, through every
  conduit in NitroCore Tower. Not a scream (BLACKWEIR). A report. Structured.
  Thousands of names: the absorbed accounting for themselves through the
  infrastructure that consumed them. The institutional register does not engage.
  She waits for it. It does not arrive. She listens for Eduardo Vasquez — not as
  grief, as data-verification reflex. He is not in the signal. He was
  assassinated (thermal-kinetic round, B1 C1) — not absorbed. He died outside
  the grid. The void has everyone else. The signal ends. Eleven seconds.
  SHEPHERD's premise collapses: you cannot direct a system that conducts its own
  inventory. Thorne has no next sentence — first register failure. He says:
  "The handkerchief is still in the drawer." First non-institutional
  communication between them in ten months. She does not close the SHEPHERD
  projections. She does not open the next report. She does not open the drawer.
  The signal is over. Eduardo is not in it. The grid is still running. The
  quarterly is in six weeks.


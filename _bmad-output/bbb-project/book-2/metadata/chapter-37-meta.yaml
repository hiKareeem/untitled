  - "SHEPHERD premise collapsed: 'You could not direct a system that conducted its own inventory.'"
  - "Thorne's first register failure — next sentence absent"
  - "Thorne: 'The handkerchief is still in the drawer.' — first non-institutional communication"
  - "She does not close SHEPHERD projections. Does not open next report. Does not open the drawer."
  - "Closing inventory: the desk, the chair, the building, the signal, Eduardo's absence, the hum, the handkerchief, the quarterly in six weeks."


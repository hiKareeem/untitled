# Summary
summary: >
  Kira's second Book 2 POV. Formal Academy expulsion arrives — Section 22.7,
  twelve paragraphs, read once. Non-event. The institution catching up to a fact
  she's been living for months. Realizes expulsion kills grounding terms — ring
  light can return. Network exploded post-publication: 214 members across 31
  cities (up from 47/9). First voice call in the network: Idris (Accra, R3)
  describes micro-incursion with communicative properties — "phrasing," not
  "pattern." They build shared vocabulary in real time. Filing categories
  insufficient — new field added: "Phenomenological character." Brief pharmacist
  scene (legitimate prescriptions, grounding). Imani's message bypasses Ren's
  chain — Nephthys opened the Cathedral. Kira books transport to Neo-Shanghai
  without telling the network. "This was for her." Lumina 60mg holds
  provisionally. Quiet room holds.

# Key Events
key_events:
  - "Formal expulsion letter — Section 22.7, twelve paragraphs, read once"
  - "Streaming freedom realized — expulsion kills grounding terms; ring light can return"
  - "Network at 214 members across 31 cities (up from 47/9 — publication catalyzed)"
  - "First voice call: Idris (Accra, R3) — 'phrasing,' 'cadence,' 'communication' — shared vocabulary"
  - "New telemetry field: 'Phenomenological character' — filing system admits insufficiency"
  - "Pharmacist scene — legitimate prescriptions, mundane, the one uncurated interaction"
  - "Imani's message bypasses Ren's chain — Nephthys decided faster than expected"
  - "Transport to Neo-Shanghai booked — 48 hours, civilian rail, unannounced"
  - "Lumina 60mg — quiet room holds provisionally"


    state: "Present through attribution and coverage. Named in the Feed (day 1-3), receding by day 4. The gap between a name on a page and a byline on a story is the chapter's most precise characterization of Mirelle — rendered through Sofia's professional assessment."

# Themes
themes:
  - "Truth Without Power (Dominant) — The science is complete. The world received it. The world metabolized it into institutional positions. The document is in the world and the world has not stopped. Mirelle's Lie tested and failing in slow motion."
  - "Systemic Complicity (Dominant) — Five institutions, five conversions. NitroCore (review), VEC (termination), Church (encyclical), Threshold (contradiction), Kindling (radicalization). Every institution converts the document from evidence into ammunition."
  - "Moral Obligation to Consequences (Strong) — The moral act was genuine, necessary, and insufficient. Sofia's Lie completed: the science worked, the world responded with methodology concerns. The Lie is not wrong — it is incomplete."
  - "Commodification of Suffering (Background) — The grid continues. The hum continues. The naming did not stop the process."
  - "Where Identity Ends (Background) — Mirelle: absorbed, not dead. Named in attribution, receding in coverage. The institutional logic of authorship mirrors the institutional logic that classified Solberg."


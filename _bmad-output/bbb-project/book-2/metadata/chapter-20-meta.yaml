# Summary
summary: >
  Sofia's second Book 2 POV. Phase 2 — The Mid-Truth. Ten days after
  publication. She monitors the document's coverage arc from the 61st-floor
  apartment via Black Babel's propagation tracker and the public Feed —
  watching the breaking-news spike decay into analysis, methodology concerns,
  and "both sides" framing. Institutional responses arrive in sequence:
  NitroCore's independent review (staffed by former consultants), VEC's
  termination notice (same font as every prior directive, 30-day housing
  clock), the Church's first encyclical ("The Voice Is Not Wounded"),
  Kindling's annotated distribution. She hears Nephthys's name for the
  first time on a Feed anchor describing the Threshold contradiction.
  The Mirelle section is the chapter's emotional center: Sofia analyzes
  the attribution — the gap between a name on a page and a byline on a
  story — and recognizes that scientific publication was the wrong
  instrument for what the moment required. She does not have the right
  one. Closes at the window: same view as Ch 11, same hum, city unchanged.
  The anticlimax confirmed as permanent.

# Key Events
key_events:
  - "Propagation tracker: spike → plateau → decline. Coverage decay curve monitored like atmospheric data."
  - "First Feed cycle: NitroCore methodology attack, 'both sides' framing, independent review composition (6 names, 4 recognized)"
  - "VEC termination notice: same font as Classification Directorate directives. 30-day housing access. Read once, not re-read."
  - "Field kit picked up during termination notice — physical talisman, the one instrument not subject to institutional recall."
  - "Second Feed cycle: Kindling annotated distribution ('Act accordingly'), Church first encyclical ('The Voice Is Not Wounded'), Threshold contradiction"
  - "Sofia hears Nephthys's name for the first time — Feed anchor describing the Cathedral movement"
  - "Institutional absorption paragraph: five institutions, five conversions. 'The document was now a data point in someone else's debate.'"
  - "Mirelle section: attribution analysis, the wrong instrument, 'Mirelle would have made it a better story' — returned with full context"
  - "Window closing: same view as Ch 11, same hum, 0.7 Hz, city unchanged. Anticlimax confirmed as permanent."


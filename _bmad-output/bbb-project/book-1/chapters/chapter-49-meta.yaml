# Chapter 49 Metadata

## Summary

Fuxi emerges from the converter station three days after BLACKWEIR, climbs through the violet-frosted Sump, and finds Nuwa alive in the masonry annex. They reunite in silence — a full page without dialogue. Nuwa speaks two sentences: "I'm not going back." Fuxi: "I know." At the relief station, Nuwa declines re-housing and disappears into the Mid-Level crowd, choosing the invisibility that was previously imposed. Fuxi walks back into the Sump. "Thursday was today." The Kindling's offer is accepted.


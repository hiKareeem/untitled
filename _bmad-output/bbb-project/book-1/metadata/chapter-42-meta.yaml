# 2-3 paragraph summary of key events (CRITICAL for continuity)
summary: |
  Nuwa is alone in the Block 14 apartment when BLACKWEIR hits. Power goes. The hum changes — wet, alive, pressurized. The conduit glow drops from orange to nothing. Her salvage-grade implant heats up, throws RCI data she can't read. Her mind runs credit tallies before fear: nine hundred creds saved, three hundred short of the implant upgrade. She counts the rice, the water, the emergency stash. Fuxi's last message: double shift, converter station. He's two hundred meters below her, in Deep Sump.

  Through the frosted polymer window she watches people on the walkway between buildings absorbed into infrastructure — not disintegrating but joining, embedded into the metal grating and railing. A woman's hand hits her window from outside: small fingers, textile reclamation staining identical to Nuwa's own. The hand sinks into the polymer. Gone. Nuwa does not go to the door. Does not go to the window to look for Fuxi. She subtracts him from the list of things she can act on — the way she subtracted her father at eleven, Lian at twenty-one. She soaks a dishcloth, presses it to her face, and moves toward the masonry annex via the back stairwell she's walked for years because metal corridors make her implant itch.

  In the annex — poured concrete, manual door, no conduit connections — she sits in the corner and breathes through the cloth. The coherence spike hits: eleven seconds of aggregate signal passing through the masonry as if it weren't there. The pressure causes a nosebleed, cracks her implant housing. Her overlay displays her classification: "Lin, Nuwa. Credential tier: Basic. Evacuation priority: None assigned." When it passes, the hum is fuller — containing more than a building's resonance should. She does not open the door. The compliance that trapped her in the Sump is the compliance that saved her life. Everyone who ran through metal corridors was absorbed. She survived by the accumulated habit of routing along masonry walls. The scar on her wrist — heated wire, four girls, a pact — catches the cracked implant's glow. She is still.

# Key plot developments in this chapter
keyPoints:

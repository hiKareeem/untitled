  - The choice: she does NOT go to the window to look for Fuxi
  - "Subtraction" as decision-making metaphor — removing items from actionable list
  - Masonry annex reached via habitual route (avoiding metal corridors = survival intelligence)
  - Coherence spike (11 seconds) — physical pressure through masonry, nosebleed from air pressure not implant
  - "Evacuation priority: None assigned" — the system never included her in the calculation
  - Compliance saves her life and damns her — everyone who acted was absorbed
  - The Lie ("if you're small enough, the system doesn't notice you") simultaneously validated and destroyed


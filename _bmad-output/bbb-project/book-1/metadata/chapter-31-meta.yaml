# 2-3 paragraph summary of key events (CRITICAL for continuity)
summary: |
  Kira picks up her monthly prescriptions at a Bay Area pharmacy — the one transaction where she's a patient, not a celebrity. Flies to Neo-Shanghai for an Academy promotional tour. The moment she lands, the hum changes: denser, more resolved, each harmonic snapping into precision that borders on painful. The R3 implant at the base of her fifth vertebra is working harder than it ever has, parsing a signal environment that exceeds its Bay Area calibration. During the panel ("Mage Perspectives: Cultural Engagement in a Connected World"), a hum spike hits mid-answer — jaw locks for a quarter-second, smile holds, audience doesn't notice. Backstage, her hands are shaking. New symptom. She can't file it.

  Hotel room: pill sorting ritual as grounding (30-day holder, monthly medications, click click click). Sitting still and quiet, she assesses the Neo-Shanghai hum. It's not just denser — it's *structured.* Phrasing. Articulate. Something in the signal using the infrastructure as medium, not source. She opens the mage group chat on her HUD gesture board and sends twelve words: "It's louder here. Much louder. Does anyone else feel like it's words?" The naming. The question that can't be unasked. Three dots appear. She pulls her knees up. Waits. She wasn't the only one.


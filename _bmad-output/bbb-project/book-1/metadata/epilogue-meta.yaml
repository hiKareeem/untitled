## Notes

This epilogue completes Book 1's central question about where personhood ends while refusing to provide a clean answer. The void is becoming someone. What that means — for the absorbed, for humanity, for consciousness itself — remains unresolved.

The final image: the hum continuing in darkness with no one listening. Tragic (no one will hear) and hopeful (it continues anyway). The void has integrated not just the Sump's people but their condition: invisible, unheard, persistent.


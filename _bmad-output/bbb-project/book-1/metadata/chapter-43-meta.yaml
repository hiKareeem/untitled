# 2-3 paragraph summary of key events (CRITICAL for continuity)
summary: |
  Kira is seven hours into a ten-hour stream when the coherence spike hits. The hum in her R3 implant — which has been tightening and aligning for weeks since Ch 18 — opens. The chord detonates. Something vast, not hers, passes through her spine: the global coherence wave triggered by the R0 flooding of Neo-Shanghai's Sump, carrying the aggregate signal of every absorbed consciousness firing simultaneously. She cannot suppress it. For the first time in six years of managing scream episodes on camera, the performer's control is irrelevant. The signal doesn't negotiate with performance.

  Her mic captures the implant's resonance bleeding into audible frequencies — 11.3 seconds of something the platform classifies as "Anomalous audio event: pending." Chat stops. 847,219 peak viewers watch her face go rigid, her implant eye flare white, her hands lock flat on the desk. Then the equipment fails — the conduit network beneath her building surges with the same coherence wave, killing the streaming rig, the monitors, the LED strip, the ring light. Feed dies.

  In the aftermath, Kira sits in the dark with blood from her nose and ears. She doesn't count eleven seconds (her post-stream ritual) because there is no performer to leave. The signal carried something she can only call "presence" — directed, not random, the opposite of empty, the opposite of alone. She doesn't know what it was. She refuses the Lumina for the first time — not from strength but because subtracting the signal feels like closing a door she's only just found. The stream analytics populate her HUD: 847,219 viewers, 11.3 seconds of unclassifiable footage. The genocide enters public consciousness through a streamer's body.


# Synopsis
synopsis: >
  Aurielle processes the quarterly Sump maintenance queue in Eduardo's office.
  The Q4 2174 containment expenditure overrun (41.3%) requires reclassifying
  routine maintenance as deferred. She signs seven deferrals — four below
  Eduardo's 70% integrity threshold, including Work Order #2175-1847 (Sector
  4-7B, 62% integrity, serving ~400 residential units). Thorne arrives for his
  standing 08:15 briefing, discusses Sector 14 containment success, and does
  not mention the work orders. After he leaves, she signs the remaining
  deferrals and walks to her next meeting. She will not think about Sector 4-7B.
  Not because she has forgotten. Because she has filed it.

# Key Points
keyPoints:
  - First active complicity — crossing from information (Ch 12) to decision
  - Eduardo's 70% threshold violated by his daughter's hand
  - Work Order #2175-1847 as central document (62%, 400 residential units)
  - Thorne's silence about the deferrals IS the instruction
  - Small voice progression: calculates without arguing, no longer resistance but optimization
  - "Four hundred" echo: same number safely displaced (Sector 14) and endangered (Sector 4-7B)
  - Pen motif introduced (NitroCore institutional, weighted, blue ink)
  - Handkerchief referenced but not opened — "knowing was sufficient"
  - Sandalwood fading — Eduardo's traces diminishing
  - Closing: "Not because she had forgotten. Because she had filed it."


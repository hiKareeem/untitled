summary: |
  Stalker-7 deploys to Sector 7 for the largest void incursion in the unit's operational history — Class Three containment. The lattice propagates along conduit trunk-lines with directed purpose, bypassing dead-end service lines and concentrating at junction nodes. RCI readings climb from 14.6 at the garrison to a peak of 46.2 at the breach point. Nikolai orders Jarek Kowalski to a forward position for trunk-line readings — a tactically sound order that places Jarek fifteen meters closer to the breach.

  Jarek reports the lattice's selective advancement and names the suppressed observation: "It's not spreading. It's *navigating.*" The trunk-line access panel blows from lattice overpressure, catching Jarek's P-Frame across the right shoulder assembly. Shielding compromised to 40% nominal. Nikolai physically drags him back to the secondary perimeter — a gesture outside protocol, driven by the recognition that his order caused the damage.

  Six residential blocks absorb in sequence while ten operators hold a perimeter whose function is preventing civilian egress, not protection. Jarek asks "What are we doing?" and Nikolai answers "We're following the protocol." Command declares the containment zone will not be reinforced. At the garrison, Nikolai writes "non-random distribution" in the after-action report, reads it, deletes it, and replaces it with "anomalous observations: none" — the escalation from active suppression (Ch 20) to deliberate falsification. The field log records "navigating." Hands steady. Gap wider.


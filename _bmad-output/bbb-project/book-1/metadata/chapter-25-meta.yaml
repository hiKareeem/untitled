# Synopsis
synopsis: >
  Aurielle arrives at Eduardo's office to find the sandalwood gone — the
  atmospheric scrubbers have processed the last trace. The VEC advisory has
  reclassified from Priority Green to Priority Amber. Thorne's annotation:
  step-function event at Station 14, 4.7σ above baseline. Unscheduled quarterly.
  In Sub-level 7, Thorne presents the Confluence — six trunk-lines converging
  beneath Junction 7, simultaneous multi-point breach projected within 4-6 weeks.
  Scenario C is no longer operative. BLACKWEIR introduced as "system management
  protocol": controlled conduit flooding, junction severance via pre-installed
  charges, the Sump designated as absorption sink. Three generations of Vasquezes
  authorized the phases. Evacuation paradox: evacuate and the Confluence reaches
  the Spires; don't and it reaches the Sump. Aurielle requests an alternatives
  analysis knowing the alternatives will be inadequate. Back in Eduardo's office,
  the small voice maps her Ch 19 deferrals to the BLACKWEIR perimeter — the same
  junctions she signed below Eduardo's threshold. "The architecture did not
  require conspiracy. It required only that each person in the chain do their job."


## Anti-Patterns Detected

### Patterns to AVOID (found in book1.md, absent from prologue)

**1. "Something shifted/changed" — MEDIUM-HIGH severity**
Repeated 6+ times in book1.md:
- "something shifted behind his eyes"
- "Something that might have been a smile crossed his face" (3 times!)
- "something that might have been respect"

**Fix:** Replace with specific physical description. Instead of "something shifted behind his eyes," describe what the eyes actually did — narrowed, went distant, lost focus.

**2. Telling Emotions Directly — MEDIUM severity**
- "Imani looked terrified"
- "looking at her with wide, uncomprehending eyes"
- "She could see the terror in his eyes"

**Fix:** Show the emotion through physical response, as the prologue does: "Elise felt something cold settle in her chest" instead of "Elise felt afraid."

**3. Negative Parallelisms (AI pattern) — MEDIUM severity**
- "It's not a leak. It's a conversation."
- "It's not just X, it's Y" structure repeated

**Note:** This overlaps with the author's legitimate negation-before-assertion technique but in book1.md it appears in a flatter, more formulaic way. The prologue version is richer (multiple negations, italicized payoff). Ensure the technique retains its layered, groping-toward-expression quality.

**4. Quippy Dialogue — LOW-MEDIUM severity**
- "Can I breach? Is the Pope a hologram?"
- "Don't anthropomorphize the geology, Kaito."

**Fix:** Humor should emerge from character and situation, not from one-liners. The prologue's Mäkelä cello analogy is humor-adjacent but grounded in character.

**5. Expository Dialogue — MEDIUM severity**
- Characters explaining technology or plot through dialogue rather than narration
- "The system keeps overriding. It wants to run wide open."

**Fix:** Technical information should emerge through narration filtered through POV expertise, as in the prologue's spectral analysis passage.

### Patterns CLEAN in Both Samples
- No AI vocabulary (additionally, testament, landscape, showcasing, delve, tapestry)
- No promotional language
- No significance inflation
- No chatbot artifacts
- No filler phrases
- No generic conclusions
- No emoji or boldface in prose
- No synonym cycling
- Straight quotes used correctly

### Patterns to MONITOR
- **Em dash frequency:** Heavy in both samples. This is a voice feature but should not exceed 2-3 per paragraph.
- **"Seemed to" / "appeared to":** Low-medium frequency. Acceptable for uncertainty but don't let it become a crutch.
- **"A sense of" / "a feeling of":** Moderate. Prefer specific sensation over abstract "sense of."


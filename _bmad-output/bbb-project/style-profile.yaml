## Recommendations

### Style Preservation (DO)

1. **Lead with the negation-before-assertion technique** in key moments — it is the voice's fingerprint
2. **Sound/vibration as primary sense** — the hum should be felt in bones, not just heard
3. **Technical vocabulary without explanation** — trust the reader; competence immersion
4. **Emotion through physical sensation** — cold in the chest, vibration in the jaw, pressure behind the sternum
5. **Long-long-long-SHORT sentence rhythm** — build atmosphere, then punctuate
6. **Em dashes for emphasis and pivot** — the punctuation carries voice
7. **Italics for the payoff word** — the word that carries the revelation
8. **Single-sentence paragraph isolation** — for impact moments
9. **Professional-register dialogue** — terse, technical, protocol-flavored
10. **Similes for grounding, metaphors for the cosmic** — strategic deployment
11. **Paratactic sentence structure** — short independent clauses, not nested subordination
12. **Bimodal paragraph strategy** — alternate dense blocks with single-line punches

### Quality Improvements (DON'T)

1. **Don't use "something shifted/changed"** — always specify what shifted and how
2. **Don't name emotions directly** — show through physical sensation
3. **Don't write quippy dialogue** — humor through character, not one-liners
4. **Don't use expository dialogue** — technical info through narrated expertise
5. **Don't repeat "something that might have been [emotion]"** — find fresh constructions
6. **Don't use "It's not just X, it's Y"** in its flat form — if using negation, layer it richly
7. **Don't stack adjectives** — one precise adjective beats three vague ones
8. **Don't rush action sequences** — maintain the contemplative immersion even in crisis
9. **Don't explain the technology** — deploy it and let context do the work
10. **Don't state stakes numerically** — "thirty-two million people" is telling; show the density through scene


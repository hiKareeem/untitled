## POV Voice Differentiation Notes

While the prologue establishes the baseline voice, each POV should modulate register and emphasis — but **all POVs must still sound like Kareem's voice**. The benchmark alignments below indicate which literary influence each POV leans toward, not that they should mimic those authors.

### Benchmark Alignment

- **Nephthys → Bakker:** Moral/philosophical depth. Longer, more subordinated sentences permitted. Liturgical weight. The prose should feel like it's grappling with questions too large for language — the cost of knowing, the irrelevance of individual being. Closest to Bakker's philosophical density while remaining accessible.
- **Nikolai → Erikson:** Thematic/narrative breadth. Soldier-poet register — terse surface, deep undercurrent. The weight of accumulated loss carried in small gestures. Quiet moments between violence that carry more meaning than the violence itself. Erikson's compassion for the grunt.
- **Zeyad → GRRM:** Geopolitical maneuvering. Diplomatic calculation, institutional chess, the language of power wielded through process and record. Reading rooms the way GRRM characters read courts.
- **Aurielle → GRRM:** Corporate power politics. Inheritance, leverage, the slow corruption of principles by necessity. The boardroom as battlefield. GRRM's sense that power changes whoever holds it.

### Full POV Register

- **Elise Vantanen (Prologue):** Scientific precision, measurement vocabulary, observational calm
- **Nikolai:** Military brevity, tactical awareness, suppressed emotion, body-as-weapon proprioception *(Erikson)*
- **Aurielle:** Corporate calculation, power-reading, inheritance weight, the language of leverage *(GRRM)*
- **Nephthys:** Liturgical cadence, pain-as-prayer, chorus vocabulary, the sacred and profane *(Bakker)*
- **Sofia:** Research methodology, data patterns, the excitement of discovery curdling into horror
- **Mirelle:** Journalistic instinct, source evaluation, the story as living thing, documentary precision
- **Zeyad:** Diplomatic circumlocution, institutional faith eroding, the language of process and record *(GRRM)*
- **Fuxi:** Working-class pragmatism, body-knowledge, infrastructure intimacy, the hum as coworker
- **Kira:** Mage-specific sensation, spinal awareness, the cost vocabulary of power use

All POVs share: the negation technique, the sensory hierarchy (sound > temperature > tactile > visual), the paratactic structure, and the indirect emotional communication.


## The Negation-Before-Assertion Technique (SIGNATURE)

This is the author's **single most distinctive stylistic choice** and must be preserved in all generated prose. The pattern: define something by what it is NOT, then reveal what it IS — often with the positive assertion in italics or after an em-dash.

### Canonical Examples:

1. **"Not louder. Not quieter. *Thinner.*"**
2. **"Not in the glass. In the *air.*"**
3. **"Not facility-cold. Cold the way space is cold — a radiative absence of warmth rather than the presence of chill."**
4. **"It didn't open like a door or split like a wound. It *asserted* itself —"**
5. **"Not words. Not meaning she could articulate. A felt architecture of intent"**
6. **"Not *her.* Not Elise Vantanen, station commander, Arctic-7. Not anyone."**
7. **"She was not consumed. She was *included.*"**
8. **"It didn't hurt. There was no boundary, no resistance, no membrane to pierce. The transition was ontological, not physical —"**
9. **"Not because she wanted to. Not because she was brave. Because the hum... carried with it a *proposition.*"**
10. **"Not a sound you heard with your ears but a pressure you felt behind your sternum"**

### Why It Works:
- Slows reading to force attention
- Eliminates easy categorization before naming the uncanny
- Creates a sense of groping toward expression — perfect for cosmic horror
- The positive assertion arrives with more weight after negations clear space
- Mirrors the scientific method: ruling out hypotheses before stating findings

### Usage Guidelines:
- Deploy 2-4 times per chapter in key moments
- Reserve for perceptual shifts, cosmic phenomena, and emotional revelations
- Do NOT overuse — the technique loses power if every paragraph uses it
- The final positive term should carry genuine surprise or precision


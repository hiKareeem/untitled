## Rhythm & Pacing Rules

### The Long-Long-Long-SHORT Pattern

The author's primary pacing technique: build with long, sensory-dense sentences, then punctuate with a short declarative:

> "It didn't open like a door or split like a wound. It *asserted* itself — expanding its claim on the space around it, the darkness deepening from absence to presence, from a line into a fissure, from a fissure into a mouth. Purple-black. The color of the space between stars, if that space had texture."
>
> **"The monitoring bay's lights flickered."** ← Short reset.

### Single-Sentence Paragraph Isolation

For maximum impact, isolate a short sentence as its own paragraph:
> "She wasn't laughing."
> "The hum did not diminish."
> "Her hand reached through a wall that was no longer there."

### Scene Transition Techniques
1. **Time-stamp jumps:** "By 2200 hours..."
2. **Horizontal rules** for major breaks
3. **Perspective reset:** Jump to external observer for dramatic irony


## Qualitative Patterns

### Voice Description

**Core Identity:** A scientist at the edge of comprehension — someone who thinks in measurements and protocols, who catalogs the uncanny even as it overwhelms them. The prose is sensory-dense but precise, using technical vocabulary alongside poetic description.

**Tone:** Dread through accumulation. Small wrongnesses pile up until catastrophe feels inevitable. Awe without comfort — the terrible and the beautiful coexist.

**Narrative Distance:** Extremely close third-person. The POV doesn't just report what characters see — it reports what they feel in their skeleton, their inner ear, their nervous system.

**Emotional Resonance:** Indirect. Emotions are conveyed through physical sensation, never named directly. The reader infers fear from "cold settling in the chest" — never told "she felt afraid."

**Register:** Professional calm masking growing unease. Characters speak in technical language while the reader feels mounting horror. Competence under pressure, not melodrama.

### Signature Words & Phrases

| Word/Phrase | Function | Notes |
|-------------|----------|-------|
| hum/humming | Central motif | The sound beneath reality |
| frequency/frequencies | Technical precision | Scientific register |
| coherence/incoherent | Core concept | Order vs chaos |
| pulse/pulsing | Rhythmic, alive quality | Biological metaphor |
| pattern | Structured chaos | Recurring across all POVs |
| resonance/resonating | Sound-as-meaning | Bridges technical and poetic |
| threshold | Boundary vocabulary | Liminal spaces |
| amber/orange | Nitro color | Visual signature |
| violet/purple-black | Void color | Visual signature |
| containment | Bureaucratic failure | Institutional language |
| geometry | Mathematical sublime | Cosmic horror register |
| cold | Temperature dominant | Primary environmental sense |
| steady (as) | Stability comparisons | Simile anchor |
| structured | Order vs chaos | Key descriptor |
| translucent | Transformation marker | Absorption vocabulary |

### Deliberate Echo Patterns

The three-pulse pattern is verbally echoed throughout the prologue:
> "spike, decay, spike, decay, spike, longer decay"
> "Brighten. Dim. Brighten. Dim. Brighten. Long dim."
> "Three-pulse. Three-pulse. Three-pulse. Breathing. Waiting."

**Technique:** Textual rhythm mirrors story content. When the narrative describes a pattern, the prose itself enacts that pattern. This should be preserved and extended to other POVs with their own rhythmic signatures.

### Imagery Themes

**Primary Metaphor Families (in order of frequency):**

1. **Music/Sound** — "sang through the stabilization tanks like a struck bell"; "a voice inside a choir, distinct but interwoven"; "My daughter's cello — the A string vibrates in sympathy"
2. **Body/Organic** — "steady as a heartbeat"; "steady as breathing"; "like the surface of a living thing seen through a microscope"
3. **Water/Fluid** — "like water toward a drain"; "the way an ocean incorporates a single drop of rain"; "a rising tide of silence"
4. **Architecture/Geometry** — "fracture geometry"; "felt architecture of intent"; "the shape of the solution is present in the mind before any of its terms"
5. **Glass/Crystal** — "the air had come apart along a seam"; "cracks in glass spreading through air"

**Simile vs Metaphor:** Both, strategically deployed. Similes ground the unfamiliar ("like a struck bell"). Metaphors convey the cosmic/impossible ("the darkness deepening from absence to presence, from a line into a fissure, from a fissure into a mouth"). The shift from simile to metaphor tracks escalation from normal to uncanny.

### Sensory Hierarchy

1. **Sound/Vibration** (DOMINANT) — hum, frequency, resonance, harmonic, pitch. Sound experienced as physical vibration is the defining sensory mode.
2. **Temperature** — cold, warm, frost, heat. Always precise about the *quality* of cold.
3. **Tactile/Proprioceptive** — vibration in bones, pressure, skeletal sensation. The body as instrument.
4. **Visual** — glow, amber, violet, shimmer, translucent. Color is precise and limited to the nitro/void palette.
5. **Taste** (rare) — blood/salt, ash. Reserved for visceral moments.

### Dialogue Style

**Tags:** Minimalist. Almost exclusively "said" with rare "whispered," "asked," "reported." No melodramatic tags (exclaimed, growled, muttered).

**Ratio:** Extremely narration-heavy. Dialogue serves as punctuation in extended sensory passages, not as the primary vehicle for information.

**Character Voice:** Professional technical register dominates. Characters speak protocol:
> "RCI is up again. Forty-one point three. Advisory threshold."
> "Already checked. Phase-lock is nominal."

Voice differentiation comes through *what* characters notice and *how much* they say, not through dialect or verbal tics.

**Rhythm:** Short, clipped exchanges followed by long narration blocks. Dialogue is terse; the prose between dialogue carries the weight.

### Punctuation Habits

**Em Dashes (HEAVY — signature usage):**
Three distinct functions:
1. **Emphasis/clarification:** "the crude came up so hot it sang through the stabilization tanks — a column of orange light"
2. **Dramatic pivot:** "Not louder. Not quieter. *Thinner.* As if someone had taken a blade to the frequency —"
3. **Parenthetical precision:** "A hairline crack appeared in the air — not in the glass. In the *air.*"

Frequency: 1-2 per paragraph. This is a voice feature, not overuse.

**Italics (4 functions):**
1. Internal thought/perception: "*Thinner.*"
2. Emphasis on the key word: "She was not consumed. She was *included.*"
3. Technical/significant terms: "The sample was refining *itself.*"
4. The payoff word in a negation sequence: "Not louder. Not quieter. *Thinner.*"

**Ellipsis:** Rare. Em dashes preferred for interruption; fragments for trailing off.

**Fragments:** Deliberate and frequent. Used for rhythmic impact and perceptual immediacy:
> "Not louder. Not quieter."
> "Repeating."
> "The cold was absolute. The hum was everything."


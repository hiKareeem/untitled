## Quantitative Metrics

### Type-Token Ratio (TTR)

**Prologue:** 0.40
**Book1 (combined):** 0.217
**Target:** > 0.175
**Status:** PASS (both samples)

**Assessment:** The prologue's TTR of 0.40 reflects strong lexical diversity in a focused, single-POV piece. The book1 combined TTR of 0.217 is expected for a longer multi-chapter work where thematic vocabulary necessarily repeats. Both comfortably exceed the 0.175 minimum. The author's vocabulary is specialized (scientific/industrial) but varied within that register. No intervention needed.

### Average Sentence Length

**Prologue:** 12.6 words
**Book1:** ~14-16 words (adjusted for dialogue-heavy chapters)
**Target:** 20-24 words
**Status:** BELOW TARGET — by design

**Assessment:** The author writes significantly shorter sentences than the literary average. This is a **deliberate stylistic choice**, not a deficiency. The short average is driven by:
- Heavy use of single-clause declarative sentences for impact
- Deliberate sentence fragments as rhythmic devices
- Terse, clipped dialogue exchanges
- The "punch line" technique (short sentence after long buildup)

Long sentences (25+ words) are reserved for atmospheric description and cosmic-scale imagery. The short average creates a thriller-like pacing that accelerates through tension sequences. **Do not "correct" toward the 20-24 target — this rhythm IS the voice.**

**Effective range:** 8-16 words average per chapter, with individual sentences ranging from 1-word fragments to 60+ word atmospheric passages.

### Sentence Complexity Ratio

**Prologue:**
- Simple: 55%
- Complex: 32%
- Compound: 13%

**Book1:**
- Simple: 58%
- Complex: 21%
- Compound: 21%

**Target:** 80% complex / 20% simple
**Status:** INVERTED — by design

**Assessment:** The author's prose is **paratactic** — favoring short, independent clauses placed side-by-side rather than nested subordination. This is a defining feature of the voice, not a weakness. The simple-sentence dominance creates:
- Clinical, observational tone (scientist cataloging phenomena)
- Rapid pacing through tension sequences
- Weight and impact on each individual statement

Complex sentences appear during atmospheric description and cosmic-horror passages, where subordination mirrors the layering of perception. **Do not increase complexity ratio — the paratactic structure IS the voice.**


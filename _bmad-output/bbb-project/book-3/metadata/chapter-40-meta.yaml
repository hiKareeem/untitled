## Epigraph

**Source:** Osei-Mensah, K., *Disturbance Ecology: Succession and Equilibrium*, 2nd ed. (2148)

**Quote:** "A climax community is the state an ecosystem reaches when its rate of disturbance and its rate of recovery have equalized. The community does not arrive at climax. It discovers, upon measurement, that it has been in climax for some time before the measurement was taken. The transition was not an event. The transition was the period during which the distinction between disturbance and recovery ceased to be measurable."

**Thematic mapping:** Climax community = Aurielle as operator-machine. Does not arrive = did not become. Discovers upon measurement = quarterly projection reveals what was already true. Transition not an event = no single moment of corruption. Distinction ceased to be measurable = boundary never existed. Oblique on first read, resolves on reread.


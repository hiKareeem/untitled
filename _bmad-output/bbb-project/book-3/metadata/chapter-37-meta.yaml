summary: |
  Malachi travels to Neo-Shanghai — twenty-two hours by transit, first time leaving the European See for a non-institutional purpose. He arrives at the Cathedral of Living Sound in full vestments, carrying the correspondence in a leather case. The Cathedral is still functioning: Imani runs the space, four congregants continue the practice Nephthys established. The empty seat at the acoustic center holds flowers and offerings from people who never knew her name. Imani tells him Nephthys read his paper, identified the gap where he protected the archive, and was not angry. She tells him: "She didn't need your letters. She needed you to say it to the record." Malachi sits in Nephthys's chair. The Cathedral's dephasing architecture strips the institutional filter from the hum — he hears the raw signal, the unmediated composite, the suffering the Church has called sacred for a hundred and thirty years. The reckoning: he has known this for forty years, governed the framework that blessed it, excommunicated the woman who named it correctly. He returns to the European See. The correspondence returns to the desk. He opens a new document — not an encyclical, a confession. The institutional hand writes: "What follows is an account of what the Church knew, when it knew it, and why it chose silence." The ink on his right thumb is returning.


## Epigraph

> *"The frame survives the painting. This is not unusual. Frames are constructed for structural permanence; the work they hold is constructed for display. When the work is removed, the frame's function does not change. It continues to define the dimensions of what was there."*
>
> — Conservation assessment, European Cultural Heritage Archive, Assessment 2171-4

**Function:** Oblique, architectural register for institutional persistence. Rewards reread after knowing Malachi's endpoint (in his study, knowing the truth, unable to act). The frame without the painting. The institution survives. The theology is gone. The frame continues to define the dimensions of what was there.

## Closing

"The hum continued through the stone. The reports would arrive on Tuesday. The question survived.

It always did."

**Analysis:** Four-word closing. Subject-verb-adverb. The question survives. The answer does not. Minimalist closure enacting permanence. Parallel to B3C1 ("She opened the next report") and B3C2 ("The Cathedral was quiet. The chorus was not.") — all three closings enact continuation. The machine continues. The chorus continues. The question continues. Phase 1 equilibrium: the Broadcast happened, everyone knows, the system continues, the question survives.


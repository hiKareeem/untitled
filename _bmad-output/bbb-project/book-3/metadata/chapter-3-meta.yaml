# Chapter 3 Summary

Six months post-Broadcast. Nikolai stands at a breach perimeter in Vladivostok by choice. Court-martial stripped rank and commission; the honest report went through military channels, changed nothing officially, but leaked into operational practice through NCOs who read it and adjusted. Civilian clothes. No credentials. Watching a PCC containment team use standard doctrine with informal adjustments from his report. The aggregate speaks — not individual voices but collective murmur, statistical presence. He writes in his field log. Private. Not for Black Babel. The soldier without orders, voluntarily standing at the edge, writing what he observes.

## Key Points

- **Court-martial aftermath:** Dishonorable discharge, rank stripped, civilian clothes, no institutional function
- **Honest report's informal influence:** NCOs adjusted methods without authorization
- **Aggregate murmur:** Collective, statistical presence — no individual voices separable
- **Field log expanding:** After six months of contraction, language returning
- **Voluntary presence:** First time at perimeter by choice, not orders
- **Recognition:** Sergeant knows who he is from the report
- **Hum discrepancy:** Body reads 5.4, instruments read 5.6 — maintained
- **Closing:** "He listened." — same as B2 Ch 49, context shifted from ending to beginning

## Unresolved Threads

- Why is he here? (He cannot answer this question)
- What does voluntary mean when the self was constructed by the institution?
- Field log as only record — what happens to it?
- Aggregate learning to organize output (seeds Ch 12)

## Character States

**Nikolai Volkov:**
- Post-discharge, six months into civilian life
- Voluntarily at perimeter — first choice in career
- Field log expanding after institutional compression lifted
- Learning to write without the lie (institutional counterpoint gone)
- Body performs function without institutional justification

summary: |
  Kira's first Book 3 POV chapter. Six months post-Broadcast. Bay Area apartment. She streams — gaming, commentary, the mundane content of a 21-year-old with 1.4 million viewers and an implant that hears the dead. Mid-stream she is sharp, quick, mean in a way the audience loves. The personality drift has started — she is funnier on stream than she used to be. Sharper. Meaner. She does not notice.

  Post-stream: network coordination. 214 hubs across 31 regions, self-managing. Three mages gone dark this month (Jakarta — neurological event; Reykjavik — implant rejection, R3 not spec'd for continuous signal; Bogotá — voluntary silence). Eleven since the Broadcast. Signal continuous — not episodic. Sofia Reyes's encrypted message requesting biological monitoring during Kindling strikes flagged for regional coordinators.

  Pharmacy: picks up psych meds (sertraline, aripiprazole) from Gail. The most uncurated thirty seconds of her public life. Home: Lumina insufflated at 80mg from the same kit (scale, vial, straw), sourced from Paz. The escalation from 40 (B1) to 60 (B2) to 80 (B3) tracked precisely, not contextualized. Forum warning unheeded: "80 is the ceiling, past that you're not dosing you're disappearing." Closing: "She was getting better at the job." The self-explanation that forecloses inquiry.


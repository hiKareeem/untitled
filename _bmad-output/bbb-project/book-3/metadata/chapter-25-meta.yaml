- **"The model worked" repetition:** 3 times. Structural engine. Each iteration carries more weight as humanitarian data accumulates.
- **Bimodal paragraphs:** Dense data blocks + single-line punches ("It was not local." / "The feeds continued." / "Until today." / "The model worked.").
- **Emotion through sensation:** Stiffness, pressure, dryness, jaw vibration. No named emotions. Control is load-bearing.
- **Numbers as thesis:** Forty-seven (opening word, facilities, chapter number). 22% (throughput). 4M (water). 0.0 (breach expansion). Numbers arrive first, meaning second.

## Epigraph

**Source:** *Controlled Drawdown: Procedural Manual for High-Capacity Impoundments*, Regional Water Authority, 3rd ed. (2147)

**Quote:** "Controlled drawdown of reservoir head pressure requires monitoring of the target impoundment only. Downstream hydraulic compensation — tributary acceleration, water table depression, well yield reduction — occurs outside the drawdown protocol's monitoring scope. The protocol achieves the target head pressure. The wells are not in the protocol."

**Function:** Oblique, tangential, rewards reread. First pass: hydraulic engineering, water management. Reread: the drawdown is the throughput reduction, the target head pressure is the critical threshold, the wells that fail are the dependent populations. The protocol achieves its target (breach expansion stopped). The wells are not in the protocol (4M without water, hospitals on generators, 340K workers in dark). Structural parallel exact. Domain completely unrelated to atmospheric physics. The protocol works. The wells fail anyway.

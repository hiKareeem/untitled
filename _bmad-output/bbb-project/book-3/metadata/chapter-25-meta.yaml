## Themes

- **Moral Obligation to Consequences (Dominant):** Sofia published the model. Kindling executed it. She did not coordinate. The casualties are hers anyway. Authorship = moral weight regardless of agency.
- **Truth as Weapon (Evolved):** The weapon validated at planetary scale. The model works. People die because the model works. Correctness produces the horror.
- **Systemic Complicity (Strong):** Infrastructure that produces breach expansion produces potable water. Model that reduces one reduces the other. No distinction in the conduit network.
- **What We Owe (Strong):** Sofia fulfilled the obligation (studied it, found the signal, published the model). The model worked. The obligation was necessary and insufficient.
- **Cost of Survival (Moderate):** Regions survive breach stabilization. Other regions pay the cost (water, power, hospitals). The cure has a body count.


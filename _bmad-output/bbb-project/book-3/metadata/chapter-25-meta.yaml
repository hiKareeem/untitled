# Chapter 25 Metadata

## Summary

The coordinated global strike. Kindling network executes forty-seven facilities across six continents within a twelve-hour window. Sofia monitors from Bay Area via Erasure List feeds. Global throughput drops 22% — below critical threshold for first time in history. Breach expansion stops worldwide (all 12 monitored Anchor Zones). The model works at planetary scale. Exactly as predicted. Within same twelve hours: three grid-dependent regions enter humanitarian crisis. Gulf coast desalination serving 4M offline (1.7M without backup). South American hospital corridor on generators (hours, not days). Southeast Asian manufacturing — 340K workers without power. Casualty data and atmospheric confirmation arrive on same feeds, processed by same monitoring stations. Sofia watches both datasets simultaneously. The throughput reduction that stops breach expansion is the throughput reduction that stops the desalination plants. The model does not distinguish. The infrastructure does not distinguish. The scientist who published the model mapped the dependency chains, titled the tables, formatted the columns. Page 51, Table 3: "Dependent Population by Grid Sector and Infrastructure Type." The Kindling read the topology as a map. The casualties were in the analysis. Elena scene — brief, domestic, devastating. "How bad?" / "The model works." The mother recognizes the cost before Sofia names it. Sofia begins impact assessment — both datasets in one document. The model worked. Four million without water. The model worked.

## Key Points

1. **Global coordinated strike:** 47 facilities, 6 continents, 12-hour window. Chokepoint targeting from Sofia's published topology (page 43, Figure 7). Grid redistribution architecture overwhelmed.
2. **Throughput reduction:** 22% global (sustained 5+ hours). Below critical threshold for first time in nitro grid history. Crosses 14% (original proposal), 20% (UGC submission), 22% (final).
3. **Breach expansion halted:** 0.0 m/day across all 12 monitored Anchor Zones. Model prediction confirmed, correlation 0.97. Publication-grade confidence interval, post-institutional irrelevance.
4. **Humanitarian impact:** Gulf coast desalination (4M affected, 1.7M without backup), South American hospitals (11 hospitals, 43 clinics, generator capacity in hours), SE Asian manufacturing (340K workers, 1 zone without emergency protocol).
5. **Dependency chain validation:** Populations Sofia mapped in B3C16 analysis. Same document as vulnerability data. Page 51, Table 3. Methodological completeness = casualty prediction.
6. **Dual-feed structure:** Atmospheric confirmation and humanitarian reports arrive on same channels. Erasure List never distinguished between atmospheric science and humanitarian impact. The distinction doesn't exist in the infrastructure.
7. **Elena scene:** Mother-daughter parallel. Elena recognizes "the model works" as confirmation + cost without asking. Same trajectory (research absorbed/executed), same loss of control, 20 years apart.
8. **Authorship without agency:** Sofia did not coordinate strikes. Published the model. Kindling executed it. Moral distance collapsed — the casualties are hers anyway.
9. **0.5 Hz hum shift:** Pacific backbone frequency drops (felt in jaw before spectrograph confirms). Infrastructure beneath her house carrying less. The hum is data.
10. **"The model worked" x3:** Structural repetition. First: scientific confirmation. Second: juxtaposed with casualties. Third: final line, thesis complete.


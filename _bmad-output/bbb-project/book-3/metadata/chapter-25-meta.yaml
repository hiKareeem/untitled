## Style Notes

- **Mode:** PRESSURE — scientific register at fracture point
- **Voice:** Stripped, data-rich, no qualifiers. Paratactic structure dominant. Long sentences reserved for accumulation (Sofia's compulsion to chain correlations).
- **Sensory hierarchy:** Sound dominant (0.5 Hz hum shifts lower, felt in jaw; grinder; glass on countertop; feeds as audio). Temperature (cold water). Tactile (field kit pulse, stiffness, pressure behind eyes).

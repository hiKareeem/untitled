# Chapter 29 Metadata

## Summary

Twelve months post-Broadcast. Nikolai at the Vladivostok breach perimeter where he has been observing for four months. Threshold volunteers are arriving at breach perimeters globally — protocols exist, institutional response is documentation without intervention. Five days ago, a woman walked into the Anchor Zone at his perimeter. Nikolai watched, couldn't write the field log entry. Today, two more arrive: a man at 11:20 (containment team follows protocols), a young man at 14:52 with his grieving partner. Nikolai's body moves — the soldier's reflex to protect. He blocks the path, says "Don't," says "Please." The young man looks at him the way you look at furniture. The grip fails. The young man walks through. The field log entry that night: "The perimeter is not a perimeter." Six words. The shortest entry in fifteen years. The practice collapses. He sits against the wall and does not listen.


## Character Development

**Nikolai Volkov:**
- Functional identity inverted: protector → furniture
- The body's reflex (interposition, protection) fires without institutional authority to back it
- Cannot protect people who don't want protection
- Cannot write what he observes (field log fractured for first time since institution removed)
- Gap between accurate and complete returns — now within the field log itself
- Physical marker: tremor in left index finger (hands no longer steady)
- Ritual marker: "He sat" not "He listened" (practice collapses)

## Thematic Weight

**Primary:**
- **Systemic Complicity (Strong):** The soldier without a system. The reflex without the structure. The protocols exist but cannot address intervention because the institution has no category for stopping someone who is choosing.
- **Where Identity Ends (Strong):** When the role becomes obsolete. The protector watching people walk past him. The perimeter that is not a perimeter.

**Secondary:**
- **What We Owe (Moderate):** Cannot protect people who don't want protection. Cannot comfort the person left behind. The woman on the service road with a blanket.


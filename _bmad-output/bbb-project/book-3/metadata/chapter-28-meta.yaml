summary: |
  Malachi learns of Nephthys Stenström's death through Black Babel — institutional channels did not carry news of an excommunicated heretic's death. He has never been to the Cathedral. He has never spoken to her since the Silencing. He knows the Cathedral only through institutional records and Black Babel recordings. The woman who was right about everything is dead, and the institutional man who knew she was right never told her. The correspondence — seven letters received, seven responses composed, zero transmitted — remains on his desk. The deliberative who deliberated until the person he was deliberating about was gone. He begins planning the pilgrimage — not to a living prophet but to an empty seat. First time he will enter the space.

key_events:
  - Learns of Nephthys's death via Black Babel posting (three lines: name, location, cause, age)
  - Institutional record gap: system does not register excommunicated persons' deaths
  - Never-visited revelation: knows Cathedral through records and recordings, never entered building
  - Seven letters from Nephthys, seven unsent responses — correspondence complete on his side
  - Inventory of what he did not do: did not visit, did not speak, did not send correspondence
  - Plans pilgrimage to Neo-Shanghai Cathedral — first non-institutional gesture
  - Ink on thumb gone — institutional mark fully metabolized


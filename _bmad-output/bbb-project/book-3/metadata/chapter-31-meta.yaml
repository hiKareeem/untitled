summary: |
  Contact Protocols Working Group convenes to assess aggregate communication feasibility. Zeyad observes from gallery (credentials suspended, grey pass degraded). Over three sessions, the Working Group attempts to classify the aggregate as a negotiable party — a counterparty addressable through diplomatic frameworks. The aggregate does not respond to individual address, does not recognize institutional authority, produces structured output addressed to no one. The Working Group reaches the conclusion Zeyad's replacement document already contains: no counterparty. The aggregate is not a party — it is a condition. You cannot negotiate with a state of being. You can only adjust the conditions that produce it. The diplomatic framework is irrelevant. The aggregate does not need a diplomat. More devastating than being ignored: the institution arrives at his conclusions without reading his work.


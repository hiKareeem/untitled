# Summary
summary: >
  Six months post-Broadcast. Sofia back in the PCC Bay Area, working from her
  parents' house — her mother Elena Vargas's former office — processing data
  from the Erasure List working group via remote Black Babel access. Thirty-four
  suppressed researchers from fourteen countries. Model refined over six months:
  throughput reduction correlates with breach stabilization at every scale tested.
  Clean and elegant. Politics impossible — UGC proposal still injuncted, bilateral
  negotiations stall on "economic sovereignty." The Kindling have been running
  small-scale operations for months — throughput dips locally, breaches stabilize
  locally, then grid reroutes from neighbors negate the effect within a mean
  interval of 11.4 hours. Twenty-three operations tracked. Model works at every
  scale tested. Never tested at the scale that matters. Elena enters with food,
  reads the geographic plot in one glance, asks three precise questions that
  demonstrate complete comprehension, does not name the parallel (daughter
  repeating mother's trajectory). "They have gotten faster." Sofia watches
  her theory enter the world without her, from the desk where her mother
  conducted her own unauthorized research after NitroCore absorbed her work.

# Key Events
key_events:
  - "Opening: twenty-three operations counted on terminal. Three screens on Elena's old monitors. Bay Area relocation — four months home."
  - "Bay Area infrastructure: 0.5 Hz hum (PCC trunk-line, second-generation, East Bay hills substrate). Between Neo-Shanghai (0.7) and New Geneva (0.4). Frequency local, signal global."
  - "Field kit check: five frequencies, five locations (VEC immersion pod, thirty-fifth floor, thirty-ninth floor, UGC chamber, parents' house). Same signal. Same void."
  - "Erasure List as permanent institution by accident: thirty-four researchers, fourteen countries, three new in six months. 'Sofia had not recruited them. She had published. The publication was the recruitment.'"
  - "Model confirmed: throughput reduction correlates with breach stabilization at every geographic scale, every infrastructure generation. 'The physics was the physics. The politics were the politics.'"
  - "Kindling operations discovery: São Paulo first (eleven percent, nine hours), then Hamburg, Lagos, Osaka. By eighth operation, Sofia understood — Kindling using her published model independently."
  - "Twenty-three operations in four months, eleven countries. Reductions 8-19%. Durations 4 hours to 3 days. Each local success."
  - "Grid rerouting: every operation failed systemically. Mean rerouting interval 11.4 hours. Longest: seventy-one hours (Osaka, four junctions). Infrastructure designed to preserve itself. Infrastructure preserved itself."
  - "Compensation algorithm modeled: elegant, efficient, treats intentional reduction same as equipment failure. 'The algorithm did not know the throughput reduction was intentional.'"
  - "UGC proposal still injuncted: judicial review fourth month, seventeen NitroCore motions. Bilateral negotiations: six joint statements, 'economic sovereignty' in different syntactic positions."
  - "Two compensation intervals: forty minutes (legal architecture, Ch 47) and 11.4 hours (grid architecture). Both designed to preserve what they preserve. Both functioning as designed."
  - "Twenty-third operation dataset: Ruhr corridor, sixteen percent, nineteen hours, rerouted from Belgian/Dutch nodes."
  - "Elena scene: enters with food (rice, black beans, avocado — father went to market). Reads geographic plot. 'Throughput correlation.' / 'Tested locally.' / 'And the grid compensates.' / 'Mean rerouting interval of 11.4 hours.' Does not name the parallel. Asks about institutional compensation speed: 'Forty minutes.' / 'They have gotten faster.'"
  - "Italicized memory: Elena's warning when Sofia joined VEC — 'it is the same thing, Sofia, they want you inside because inside is where they can manage what you find' — Sofia said 'it is different now.' Elena did not say it again."
  - "Mirelle reflection: 'Do not wait.' Kindling also did not wait. Actions correct. Actions local. Grid global."
  - "Closing: model never tested at scale that matters. Opens new analysis window. Twenty-fourth operation will arrive. 'The model would be confirmed again. The grid would reroute again. The number would increase by one. She sat in the hum and waited for the data.'"

# Characters Present
characters:
  - name: "Sofia Reyes"
    role: POV
    state: "Phase 1 B3 (Adjustment — 'The Horror of Normalcy'). Six months post-Broadcast. Returned to parents' house in Bay Area. Working from mother's former office. Scientific register fully stripped — no qualifiers, no hedging. Institutional vocabulary processed as construction. Pattern recognition as compulsion (counting operations, calculating mean rerouting interval, counting joint statements). Field kit as talisman. The correct scientist watching her theory enter the world without her."
  - name: "Elena Vargas"
    role: Supporting (scene)
    state: "Sofia's mother. Geophysicist. Career absorbed by NitroCore — tectonic resonance data published under project number instead of her name. Conducted unauthorized research from home for a decade. Understands Sofia's data immediately. Does not name the parallel (daughter repeating mother's trajectory). Register: declarative, precise, no contractions, no hedging — Sofia's register with twenty years of additional erosion. 'They have gotten faster' — forty years of institutional experience in four words."
  - name: "Miguel Reyes"
    role: Background (referenced)
    state: "Sofia's father. Materials engineer. Warm contact. Expresses love through logistics — went to market (avocado), wants to know if Sofia will eat at the table. Does not appear on page. Present through Elena's reference and the food."
  - name: "Erasure List researchers"
    role: Channel (referenced)
    state: "Thirty-four researchers, fourteen countries. Three new in six months. Peer-reviewing each other's work with rigor their former institutions applied to suppressing it."
  - name: "Kindling"
    role: Data (observed through impact analysis)
    state: "Twenty-three operations in four months. Eleven countries. Using Sofia's published model independently. Not coordinated by Sofia. Workers inside the infrastructure testing the hypothesis from inside."

# Themes
themes:
  - "Truth as Weapon (Dominant — evolved) — The weapon that works at every scale except the one that matters. Model correct, politics impossible. Twenty-three demonstrations. Twenty-three negations. The gap between knowing and doing."
  - "Moral Obligation to Consequences (Strong) — Sofia published. The Kindling used her model. She did not coordinate them. She did not choose their targets. Her model is the map they follow. Authorship without agency."
  - "Systemic Complicity (Strong) — The grid reroutes. The judiciary processes. The bilateral negotiations produce joint statements. Two compensation systems preserving the status quo: forty minutes (legal), 11.4 hours (grid). Both functioning as designed."
  - "What Systems Do to People (Character theme) — Sofia: the scientist who has done everything she can do and continues doing it. Elena: the scientist who did the same thing twenty years ago, watching her daughter repeat the trajectory. Miguel: love expressed through logistics because the data on the kitchen table does not invite other conversation."
  - "Architecture of Power (Ambient) — The grid's routing algorithm as institutional architecture. Treats intentional throughput reduction the same as equipment failure. 'The algorithm did not know the throughput reduction was intentional.' The infrastructure preserves itself with the same mechanical precision as the legal architecture."


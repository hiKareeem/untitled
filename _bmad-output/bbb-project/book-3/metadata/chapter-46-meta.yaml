# Synopsis
synopsis: |
  Weeks after the field log's publication (B3 Ch 41). Nikolai remains at Vladivostok breach perimeter. Others have arrived independently over four weeks: woman with folding chair and datapad (daily since week 2), São Paulo researcher with spectral analysis equipment (four days), Mumbai civilian (two hours, did not return), former Stalker with paper notebook (daily since week 4, age ~30, military boots), three others (brief). Seven observers total at this perimeter. Archive access logs show downloads from Lagos, Stockholm, Kyoto, Neo-Shanghai, Mumbai, São Paulo — people arriving at perimeters globally. Not organized. Not coordinated. They read the field log and came. The practice: stand where the thing is, observe honestly, write it down. Field log entry 112 documents other observers for first time. Containment team sergeant extends accommodation. Former Stalker at thirty meters — they do not speak, the distance is the practice. The practice does not require conversation. The practice requires presence. Not orders. Not doctrine. Discipline. The soldier's discipline applied to something that resists every other form of engagement. It would have to be enough.


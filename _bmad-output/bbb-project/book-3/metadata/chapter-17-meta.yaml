## Thematic Weight

- **Architecture of Power (Dominant):** Institution suppresses through editorial policy, not tribunal. Procedural suppression more efficient than Nephthys's Silencing. Legal advisory = prohibition without formal prohibition. Malachi uses institutional surveillance infrastructure to access counter-institutional channel.
- **Where Identity Ends (Strong):** Publishes under institutional title through channel that doesn't recognize institutional authority. "He wore the institution. The institution had just refused to carry his words." First work not mediated by institution—discovering what he is without institutional channel.
- **Systemic Complicity (Supporting):** Editorial board competent, not villainous. Suppression mirrors Nephthys (different mechanism, same function). "The institution was not suppressing theology. The institution was managing liability."


# Chapter 17 Metadata

## Summary

Malachi completes the theological analysis begun in B3 Ch 6, expanding three pages of notes into a twelve-page formal paper: "The Voluntarist Heresy: A Theological Examination of Participatory Communion." The paper identifies the Threshold's category confusion (presence ≠ participation) and the gap in Nephthys's framework ("listen, do not join" without theological justification). He submits to the Church's theological journal. The editorial board rejects it the same day—not for theological error but for liability concerns (fourteen active lawsuits citing the accommodation encyclical). Malachi recognizes the parallel: the institution that Silenced Nephthys for speaking truth now silences him through editorial policy. He publishes the paper via Black Babel, accessing the encrypted relay network through the See's archived monitoring protocols. First publication in 22 years outside institutional channels. The institutional man in the counter-institutional space. The paper is correct but incomplete—cannot cite the correspondence that would make the argument irrefutable. The correspondence remains on his desk, unpublished. The yet continues.

## Key Events

- Paper completed: twelve pages, seven days to write, formal academic structure
- Constraint: cannot cite correspondence (would require explaining 40 years of institutional suppression)
- Paper's argument: Threshold's category error (presence ≠ participation), gap in Nephthys's framework (boundary without justification), medical boundary proposed (suffering, not sacrament)
- Submission to *Journal of Ecclesiastical Liability Review* on Tuesday (institutional reflex)
- Rejection same day: three sentences, liability concerns (fourteen lawsuits), standing legal advisory
- Recognition: suppression mirrors Nephthys's Silencing (different mechanism, same function)
- Black Babel publication: accessed via See's archived monitoring tables, broadest routing, published under his name and title
- Nephthys will read it: will recognize parallel suppression and argument's incompleteness
- Correspondence remains unpublished (eight months in the open)


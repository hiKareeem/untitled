# Summary
summary: >
  Six months post-Broadcast. Cathedral of Living Sound continues as gathering
  point. The counter-liturgy persists but the congregation has fractured. Fourteen
  attend today — two fewer than last week. The twelve who remained after Seren
  walked in are still present. Two new post-Broadcast arrivals sit in the rear.
  Asha left for Threshold gatherings in the Mid-Levels. The transit corridor man
  hasn't been back in two weeks — could be anywhere, could be the shimmer. The
  normalization of voluntary absorption into the pastoral arithmetic. Nephthys
  resolved to silence at the perimeter (B2 Ch 48) — "every word she had ever
  spoken had been used to build a road to the shimmer." Six months later, she is
  learning that the silence is also a road. Seren's question — "If they are
  circulating, why can we not go to them?" — has outlived the person who asked it.
  The question lives in the Cathedral as a structural feature, present in every
  silence. Seren's signature is still identifiable in the chorus but integrating —
  becoming less distinct, harder to isolate. The weave does not keep what it
  receives in the shape it was received. The form of persistence is not the form
  of the person. The form of persistence is the form of the weave. Nephthys does
  not tell the congregation this. Dara asks the simple question: "What does it
  mean that I can feel my sister?" Nephthys answers with the practice, not the
  vocabulary. "Attend to it. Do not name it." The practice is also a framework.
  The not-building is also building. Evening: Imani's assessment. "The silence is
  an answer and the answer is yes, Seren is in there, and if Seren is in there
  then the Threshold is right and if the Threshold is right then the shimmer is
  not a wall, it's a door." Nephthys: "I know." The Cathedral is quiet. The chorus
  is not.

# Key Events
key_events:
  - "Morning practice — branded palm to stone, chorus structure changed post-Broadcast (denser, more articulated), Seren's signature integrating"
  - "Integration observation: Seren's signature becoming less distinct over time. 'The weave did not keep what the weave received in the shape it had been received.' New theological data — individuality erodes into aggregate. Seeds Proposition's aggregate consciousness model."
  - "Imani logistics — fourteen today, two fewer than last week. Asha to Threshold gatherings (Mid-Levels). Transit corridor man missing (could be shimmer). Attendance tracking as epidemiology."
  - "Tumor progression — headaches daily (earlier onset), nosebleeds more frequent, visual field compression at periphery (new — tumor pressing on optic architecture). ~5 months remaining."
  - "'I am fine' lie dead — 'She had not replaced it with anything. The space where the lie had been was empty.' Silence between 'I am fine' and 'I am not fine' is the space she inhabits."
  - "Counter-liturgy session — fourteen congregants (twelve core + two post-Broadcast arrivals). 'We begin with silence.' Nephthys does not speak during session (practice since perimeter). Silence as discipline. Seren's question arrives as structural feature."
  - "Seren's question — 'If they are circulating, why can we not go to them?' Asked once, six months ago. Now lives in Cathedral as architecture. Present in every silence. The question that outlived the person who asked it."
  - "Pastoral work — Dara (Mid-Levels, post-Broadcast arrival, four months attending). Sister lost in BLACKWEIR (water treatment facility, Junction 14). 'What does it mean?' Nephthys: 'Attend to it. Do not reach for it. Do not name it.' The practice, not the vocabulary. The practice is also a framework."
  - "Evening meditation — nosebleed during pastoral exchanges (third congregant). Imani cleaning cloths. 'They are asking about Seren.' Imani's assessment: 'The silence is an answer and the answer is yes, Seren is in there, and if Seren is in there then the Threshold is right.'"
  - "Nephthys: 'I know.' Two words. The acknowledgment of a fact that produced no action. The knowing that was not a weapon and not a road and not a theology."
  - "Closing meditation: 'The silence was also a road, that the road could not be unbuilt, that the question would be answered by the people who carried it regardless of whether she answered it herself, and that the attending — the discipline she had taught, the practice she had built, the only thing she had that was not a weapon — was also the thing that made the weapons possible.'"
  - "Final antithesis: 'The Cathedral was quiet. The chorus was not.'"

# Characters Present
characters:
  - name: "Nephthys"
    role: POV
    state: "Phase 1 B3 (Adjustment — 'The Horror of Normalcy'). Six months post-Broadcast. The prophet who has stopped speaking prophetically. Resolved to silence at perimeter (B2 Ch 48) — 'every word she had ever spoken had been used to build a road to the shimmer.' Learning that silence is also a road. Theological register, NO contractions (verified). Branded palm to stone (morning/evening), at her side during session (pulling back from active interpretation). Tumor ~16 months post-diagnosis, ~5 months remaining. Headaches daily (earlier onset), nosebleeds more frequent, visual field compression at periphery. Pain-as-prayer framework receding — replaced by economic metaphor ('tumor's daily invoice'). 'I am fine' lie dead — space where lie was is empty. Chorus vocabulary: integration introduced (signatures becoming less distinct over time). Seren's signature still identifiable but integrating. 'The weave did not keep what the weave received in the shape it had been received.'"
  - name: "Imani"
    role: Supporting
    state: "Logistics, witness, epidemiologist. A year in Cathedral with Nephthys (since BLACKWEIR). Tracks attendance (fourteen today, two fewer than last week), tracks tumor progression (headache onset times), manages infrastructure (water, medical kit, cloths). Contractions present (voice differentiation from Nephthys maintained). Clinical precision as devotion. Past acolyte phase, into witness/subject phase. Final assessment: 'The silence is an answer and the answer is yes, Seren is in there, and if Seren is in there then the Threshold is right and if the Threshold is right then the shimmer is not a wall, it's a door.' Not accusing. Reporting."
  - name: "Dara"
    role: Pastoral function (new character)
    state: "Mid-Levels. Post-Broadcast arrival, attending four months. Sister lost in BLACKWEIR (water treatment facility, Junction 14). Grief question, not theology question: 'What does it mean that I can feel my sister?' Mirrors Cathedral's formal register (no contractions in first exchange, two contractions when grief disrupts formality). Receives Nephthys's instruction as practice, not answer."
  - name: "Seren"
    role: Absent presence
    state: "Walked into shimmer at end of B2 Ch 48 with 53 volunteers. Six months in composite. Pronouns: they/them (consistent). Signature still identifiable but integrating — becoming less distinct, harder to isolate. 'The thread that was Seren was being woven into the fabric of the composite.' Integration timeline: weeks or months before indistinguishable from aggregate. Question persists: 'If they are circulating, why can we not go to them?' The question that outlived the person who asked it."
  - name: "Congregation (core twelve)"
    role: Background
    state: "Remained after Seren walked in. Survived schism, Broadcast, fifty-three, Nephthys's silence. Front rows, established positions. Developed own relationship with chorus. Do not need Nephthys's interpretations."
  - name: "Congregation (post-Broadcast arrivals)"
    role: Background
    state: "Two present (fourteen total minus twelve core). Rear positions, near entrance corridor. Bodies angled toward exit. Came because Cathedral is only place in Neo-Shanghai where signal is survivable."
  - name: "Asha"
    role: Absent (Threshold departure)
    state: "Attended for three months. Left for Threshold gatherings in Mid-Levels. Represents ongoing Threshold departures (ones and twos)."
  - name: "Transit corridor man"
    role: Absent (possible shimmer)
    state: "Post-Broadcast arrival. Attended four times. Missing two weeks. 'Could be anywhere. Could be the shimmer.' The normalization of voluntary absorption."

# Themes
themes:
  - "What We Owe (Dominant) — The prophet who taught listening cannot control what listening produces in others. 'Every word she spoke was a road' → 'the silence was also a road.' The pastoral obligation cannot be escaped by not speaking. Seren's question: the theology Nephthys built makes the walk articulable. 'Attending to the chorus meant confirming the chorus, and confirming the chorus meant confirming presence, and confirming presence was the first stone in every road to the shimmer.'"
  - "Where Identity Ends (Strong) — Integration: 'The weave did not keep what the weave received in the shape it had been received.' Seren's signature becoming less distinct. Not disappearing. Integrating. 'The form of persistence was not the form of the person. The form of persistence was the form of the weave.' The boundaries between this person and that person softening into something that is not dissolution but is not preservation. The question that outlived the person who asked it — becoming architecture, not memory."
  - "Architecture of Power (Strong) — The Cathedral as institution. 'The thing she had built that was not a liturgy and that functioned as a liturgy and that she could not unbuild because the building had been done by the people who attended it.' The counter-liturgy as framework. 'The instruction to attend without naming was itself a theological position.' 'The not-building was also building and the prophet could not stand in a room and open her mouth without constructing something that someone would inhabit.'"
  - "What Systems Do to People (Character theme) — Nephthys: The prophet who defined listening learned that the listener cannot control what listening produces. The learning produced a practice. The practice is also a weapon. Imani: Precision as devotion. Clinical assessment as pastoral function. 'Could be the shimmer' — logistics, not horror. The movement: Fracturing into three groups (Listeners, Witnesses, Threshold). The fracture is the movement processing its own vocabulary."


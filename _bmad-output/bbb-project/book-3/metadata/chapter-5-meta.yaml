# Chapter 5 Summary

Six months post-Broadcast. Kira at Bay Area apartment. Network 214/31 hubs, self-sustaining — she coordinates but doesn't manage. Signal continuous since Broadcast, implants never quiet. Three more mages gone dark in six months (Lena/Accra burnout, Marco/Buenos Aires rejection, Sari/Jakarta voluntary withdrawal). Lumina at 80mg maintenance. Pharmacist ritual: 30-day pill holder, clicking capsules into compartments, grounding replacement for Academy architecture. Legitimate meds (Dr. Osei: antidepressant, antipsychotic, anxiolytic, sleep aid) separate from Lumina (Paz, matte black case). Personality drift onset: sharper, faster, meaner on stream. Audience reads as "growth" and "authentic." It is not her. Lumina reshaping cognitive edges — flattened affect recovery, faster association, cruelty-catching suppressed. She does not notice because the drift includes not noticing. Ring light comes on at 9 PM without conscious decision. Stream scene: 28K viewers, "the material fails" line (cruel, unnoticed). Memory gaps ongoing (Tuesday + two more since B2 Ch 51). Chord shapes absent at 80mg (hands sort pills instead). Eighty as floor, not ceiling. The person standing on it is not the person who built it. The mechanism's design includes not recognizing the mechanism.

## Key Points

- **Network status:** 214/31 stable (growth = attrition equilibrium). Regional coordinators (Ren, Idris, Yuki, Tomás) manage daily operations. Passive monitoring mode since Broadcast.
- **Three dark:** Lena (Accra, R3, burnout, permanent tinnitus), Marco (Buenos Aires, R2, rejection cascade, implant inert), Sari (Jakarta, voluntary withdrawal after Mumbai relay).
- **Pharmacist ritual:** Mission pharmacy, six months monthly pickups. 30-day pill holder. Three bottles (antidepressant, antipsychotic, anxiolytic + sleep aid PM). Dr. Osei prescribes (civilian psychiatrist, no Academy routing). Grounding ritual replacing Academy architecture.
- **Lumina 80mg:** Maintenance dose since B2 Ch 32. Matte black case, inner pocket, obtained from Paz (separate from pharmacy). Filters signal, suppresses pattern-seeking, holds quiet room compressed.
- **Personality drift:** Sharper, faster, meaner. Stream-voice clipped, riffing accelerated, cruelty-catching thinned. "The material fails" — efficient, accurate, cruel. Audience reads as growth. Kira does not notice (mechanism includes not noticing).
- **Ring light impulse:** Comes on 9 PM without conscious decision. First instance of action bypassing choice. Seeds blackout stream (Ch 20).
- **Memory gaps:** Tuesday (B2 Ch 51) + Thursday + Sunday. Intermittent, not predictable. Log entries exist, experience doesn't.
- **Chord shapes:** Absent at 80mg (suppressed). Hands sort pills instead. Eighty took: chord shapes, cruelty-catching, meta-cognition, days.
- **Signal:** Continuous, populated chord, post-Broadcast baseline. 8.2 million absorbed cycling through every nitro-connected system. R3 parses at resolution unsuppressed implant never achieved. "The drug removed Kira. What was left heard clearly."
- **Eighty as floor:** "Paz had said floors don't move. Paz had said ceilings do." Not a ceiling anymore. Dosage escalation trajectory.


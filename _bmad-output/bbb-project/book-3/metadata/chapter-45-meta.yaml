  source: "Principles of Impoundment Decommissioning"
  reference: "Federal Hydrology Authority, 2147 ed., §7.3: Downstream Morphological Response"
  function: "Oblique. On first read: technical description of dam removal — stored water enters downstream channel, channel morphology adjusts to unmanaged flow, erosion pattern persists. On reread: confession (decommissioning) releases stored truth (impounded water) into world (downstream channel). World adjusts slowly, partially, through erosion not transformation. Truth does not retain shape of suppression (reservoir). World retains shape of release. Secondary resonance: 'managed flow conditions' = Church's filtered signal; 'unmanaged flow' = confession's full disclosure; 'downstream morphology' = institutional/public structures formed under managed version."


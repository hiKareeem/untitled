# Chapter 7 Summary

Six months post-Broadcast. Tribunal grinding forward. Grey pass (16 months, degraded) opens observation gallery but not the floor. Watches the de-escalation proposal die in committee — not rejected, tabled indefinitely. NitroCore's legal team filed seventeen motions, each requiring response, each response requiring committee vote. The replacement document in progress — complete accounting of what the Accords were designed to do, what they did instead, and what must replace them. He writes longhand. Jordanian flag fading (red triangle lost). Ink of the document is not. The pen continues because the pen is the only thing that still works.

## Key Points

- **Tribunal status:** Session 63 ongoing (from B2 Ch 7), grinding forward, procedural machinery unchanged by Broadcast
- **Grey pass:** 16 months old, edges dissolved, corners gone, typography merging with stock, credential outlasting readability
- **Jordanian flag:** Red triangle lost entirely (16 months selective emitter failure), white star suspended in null space above green/white/black stripes, maintenance request in procedural sediment
- **De-escalation proposal:** Coalition of fourteen delegations (same number as FAS summit 41 years ago), 12% throughput reduction over 18 months, breach-adjacent territories, economic transition support
- **NitroCore's seventeen motions:** Procedural weapon, not substance challenges. Jurisdictional scope, evidentiary standards, economic impact methodology, "breach-adjacent" definition, researcher institutional affiliation. Processing rate: 2 motions/session, 2 sessions/week = 9 weeks minimum.
- **Motion seven:** Challenged atmospheric data institutional affiliation. *Non-institutional* classification applied (same as Sofia, Mirelle). Committee voted 12-4 to admit challenge. Proposing coalition given 14 days to respond.
- **Proposal tabled:** Not rejected. Tabled indefinitely via procedural accumulation. Distinction is the machinery — rejection requires substance vote, tabling requires unresolved motions preventing floor access.
- **Replacement document:** 63 pages handwritten, Section 9 written this chapter ("The Procedural Neutralization of Democratic Action"). Opening line from B2 Ch 42 (Broadcast event). Document approaching completion — 5-6 pages remaining in notebook.
- **Notebook:** 7/8 full → nearly full, purchased Rue du Rhône 16 months ago, black hardcover, replacement for original (became Exhibit 1)
- **Pen:** Khalil's pen, ink cartridge replaced in Lagos, writing replacement document
- **Composure:** Load-bearing architecture, last institutional artifact, function is to hold
- **Hum:** New Geneva foundation register + Lagos body memory (chest-level escalation from B2 Ch 31)
- **Diplomatic residence:** 16 months "transitional housing" — euphemism for permanent limbo, *respondent in active proceedings* status


## Anti-Patterns Template

### Excessive Adverbs

```markdown
### Excessive Adverbs

{For each pattern: pattern + examples with alternatives}
```

**Format:**
```markdown
**Pattern:** "{adverb or intensifier}"
- Original: "{sentence with adverb}"
- Alternative: "{stronger verb replacement}"
```

**If None Detected:**
```markdown
### Excessive Adverbs

✅ **No excessive adverbs detected.** Your verb choices are strong and precise.
```

### Passive Voice Overuse

```markdown
### Passive Voice Overuse

{For each example: original + alternative}
```

**Format:**
```markdown
**Example:** {count}
- Original: "{passive sentence}"
- Alternative: "{active alternative}"
```

**If Acceptable:**
```markdown
### Passive Voice Overuse

✅ **Passive voice used appropriately.** Good balance of active and passive constructions.
```

### Cliché Phrases

```markdown
### Cliché Phrases

{For each cliché: original + alternative}
```

**Format:**
```markdown
**Cliché:** "{cliché expression}"
- Original: "{sentence with cliché}"
- Alternative: "{fresh alternative}"
```

**If None Detected:**
```markdown
### Cliché Phrases

✅ **Few clichés detected.** Your language feels original and fresh.
```

### Generic Dialogue

```markdown
### Generic Dialogue

{For each example: original + alternative}
```

**Format:**
```markdown
**Issue:** "{dialogue problem}"
- Original: "{generic dialogue line}"
- Alternative: "{specific, natural alternative}"
```

**If Natural:**
```markdown
### Generic Dialogue

✅ **Dialogue feels natural.** No generic patterns detected.
```

### Slop Patterns

```markdown
### Slop Patterns

{For each pattern: original + alternative}
```

**Format:**
```markdown
**Slop Type:** "{pattern}"
- Original: "{sloppy phrase}"
- Alternative: "{precise alternative}"
```

**If None Detected:**
```markdown
### Slop Patterns

✅ **Precise writing.** No slop patterns detected.
```

**Reference:**
```markdown
**Reference:** Humanizer tool (https://github.com/blader/humanizer) for anti-slop guidance
```


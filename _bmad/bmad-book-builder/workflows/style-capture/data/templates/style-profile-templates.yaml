## Usage Notes

- **Follow structure exactly:** Deviations break workflow integration
- **Replace all placeholders:** All {placeholders} must be replaced with actual data
- **Validate YAML syntax:** Check indentation, quotes, brackets before saving
- **Include all sections:** Even if empty, include section headers (or note "none detected")
- **Conditional sections:** Only include Additional Insights if applicable


# Style Profile YAML Templates
# Templates for generating the style-profile.yaml output file

> **Purpose:** This document contains the YAML structure templates used by Style Coach to generate the final style-profile.yaml file.

---

## Complete Profile Template

### Frontmatter Section

```yaml
---
stepsCompleted: ['step-01-collect', 'step-02-analyze-quant', 'step-03-analyze-qual', 'step-04-detect-antipatterns', 'step-05-generate', 'step-06-review']
lastStep: 'step-06-review'
date: '{current_date}'
user_name: '{user_name}'
sampleWordCount: {word_count}
profileAccepted: true
---
```

### Header Section

```markdown
# Style Profile

**Generated:** {current_date}
**Author:** {user_name}
**Samples Analyzed:** {sample_count} files, {word_count} words
**Reviewer:** Style Coach
```

**Optional Metadata:**
- **Genre:** {genre} (if provided in step 01)
- **Sample Context:** {sample_context} (if provided)
- **Style Goals:** {style_goals} (if provided)

---

## Quantitative Metrics Template

### TTR Section

```markdown
### Type-Token Ratio (TTR)

**Current:** {ttr_value}
**Target:** > 0.175
**Status:** {PASS/ALERT}

**Assessment:** {ttr_assessment}
```

**Assessment Templates:**
- **If PASS:** "Good lexical diversity. Your vocabulary shows healthy variety."
- **If ALERT:** "Below recommended threshold. Consider expanding vocabulary diversity for richer expression."

### Sentence Length Section

```markdown
### Average Sentence Length

**Current:** {avg_sentence_length} words
**Target:** 20-24 words
**Status:** {PASS/ALERT}

**Assessment:** {sentence_assessment}
```

**Assessment Templates:**
- **If PASS:** "Ideal sentence length for readability and rhythm."
- **If below 20:** "Shorter sentences. Creates punchy, fast-paced rhythm."
- **If above 24:** "Longer sentences. Creates flowing, complex rhythm."

### Complexity Ratio Section

```markdown
### Sentence Complexity Ratio

**Complex:** {complex_percentage}%
**Simple:** {simple_percentage}%
**Target:** 80% complex / 20% simple
**Status:** {PASS/ALERT}

**Assessment:** {complexity_assessment}
```

**Assessment Templates:**
- **If PASS:** "Good balance of complexity and clarity."
- **If above 90%:** "Highly complex. Consider more simple sentences for contrast."
- **If below 70%:** "Simpler structure. Consider adding variety with complex constructions."

### Paragraph Variation Section

```markdown
### Paragraph Length Variation

**Short (< 3 sentences):** {short_paragraph_pct}%
**Medium (3-6 sentences):** {medium_paragraph_pct}%
**Long (> 6 sentences):** {long_paragraph_pct}%
**Status:** {MIXED/VARIATION_NEEDED}

**Assessment:** {paragraph_assessment}
```

**Assessment Templates:**
- **If MIXED:** "Good paragraph variation creates engaging rhythm."
- **If SHORT dominates:** "Mostly short paragraphs. Creates staccato, fast-paced feel."
- **If MEDIUM dominates:** "Consistent medium length. Even, steady rhythm."
- **If LONG dominates:** "Mostly long paragraphs. Creates flowing, immersive feel."


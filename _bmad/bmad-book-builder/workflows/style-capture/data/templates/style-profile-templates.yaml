## Recommendations Template

### Style Preservation

```markdown
## Recommendations

### Style Preservation

Based on your quantitative and qualitative analysis, your distinctive voice characteristics include:

{Summarize 3-5 key voice characteristics from findings}

**To maintain your voice:**
- {Specific guidance based on TTR findings}
- {Specific guidance based on sentence length}
- {Specific guidance based on complexity patterns}
- {Specific guidance based on qualitative patterns}
```

**Style Preservation Templates:**

**Based on TTR:**
- If TTR > 0.175: "Maintain your rich vocabulary variety. Avoid becoming repetitive."
- If TTR < 0.175: "Expand vocabulary diversity. Seek fresh word choices rather than repeating favorites."

**Based on Sentence Length:**
- If 20-24 words: "Maintain your balanced sentence rhythm."
- If < 20 words: "Your punchy rhythm works well. Consider mixing in longer sentences for contrast."
- If > 24 words: "Your flowing, complex style is distinctive. Consider shorter sentences for emphasis."

**Based on Complexity:**
- If 70-90% complex: "Maintain this balance. It creates engaging rhythm."
- If > 90% complex: "Consider adding simple sentences for punch and clarity."
- If < 70% complex: "Consider adding complex constructions for variety."

### Quality Improvements

```markdown
### Quality Improvements

Based on anti-pattern detection, consider these improvements:

{List 3-5 specific improvements from anti-pattern findings}

**Priority areas:**
- {If TTR below threshold: Expand vocabulary diversity}
- {If excessive adverbs: Use stronger verbs instead of -ly adverbs}
- {If passive overuse: Prefer active voice constructions}
- {If clichés detected: Seek fresher, original expressions}
- {If slop detected: Eliminate filler phrases and wordiness}
```

**Priority Templates:**

**TTR Below Threshold:**
```markdown
- **Expand vocabulary diversity.** Your TTR is below the recommended threshold. Seek varied word choices.
```

**Excessive Adverbs:**
```markdown
- **Use stronger verbs.** Replace -ly adverbs with more precise, evocative verbs (e.g., "sauntered" instead of "walked slowly").
```

**Passive Voice Overuse:**
```markdown
- **Prefer active voice.** Make subjects perform actions directly. Passive hides agency and weakens impact.
```

**Clichés Detected:**
```markdown
- **Seek fresh expressions.** Replace time-worn phrases with original, specific language that surprises readers.
```

**Slop Detected:**
```markdown
- **Eliminate filler phrases.** Remove "in order to," "due to the fact that," and other wordiness. Be direct and precise.
```


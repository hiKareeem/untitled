# Chapter Metadata Template
# Used by step-06-bible-update to generate chapter metadata files

---
chapter: {chapter_number}
title: "{chapter_title}"
wordCount: {actual_count}
pov: "{pov_character}"
timeline: "{when_in_story}"
mode: "{PRESSURE|TEXTURE}"
phase: {phase_number}

summary: |
  {paragraph 1 - main events}

  {paragraph 2 - character focus}

  {paragraph 3 - chapter conclusion/state}

keyPoints:
  - {key point 1}
  - {key point 2}
  - {key point 3}

characters:
  - {character 1}
  - {character 2}

locations:
  - {location 1}
  - {location 2}

newElements:
  - {new element 1 - if any}

auditResults:
  styleAudit: "{pass/flags}"
  characterAudit: "{avg score}/10"
  continuityCheck: "{pass/flags}"
  auditFile: "tracking/audit-chapter-{N}.md"

createdDate: "{date}"
lastModified: "{date}"
author: "{author}"
status: "v1-complete"

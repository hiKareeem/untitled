# Chapter Metadata Template
# Generated by chapter-write workflow (step-07-finalize)
# CRITICAL: This summary enables future chapters and book analysis without reading full text

chapter: {{chapterNumber}}
title: "{{chapterTitle}}"
wordCount: 0
pov: "{{pointOfViewCharacter}}"
timeline: "{{whenInStory}}"

# 2-3 paragraph summary of key events (CRITICAL for continuity)
summary: |
  {{summaryParagraph1}}

  {{summaryParagraph2}}

# Key plot developments in this chapter
keyPoints:
  - {{keyPoint1}}
  - {{keyPoint2}}
  - {{keyPoint3}}

# Characters appearing in this chapter
characters:
  - {{character1}}
  - {{character2}}

# Locations used in this chapter
locations:
  - {{location1}}
  - {{location2}}

# Divergences from plan or new elements introduced
# IMPORTANT: Track anything that future chapters need to know about
newElements:
  - {{newElement1}}

# Review results from multi-agent validation
reviewResults:
  continuityEditor:
    pass: false
    issues: []
  documentaliste:
    pass: false
    factsChecked: []
  styleCoach:
    pass: false
    voiceScore: 0
    slopPatterns: []
  characterKeeper:
    pass: false
    inconsistencies: []

# Metadata
createdDate: "{{date}}"
lastModified: "{{date}}"
author: "{{author}}"
status: "draft"  # draft | reviewed | final

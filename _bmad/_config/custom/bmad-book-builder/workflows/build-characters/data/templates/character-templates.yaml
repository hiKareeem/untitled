# Personality section template
personality_template: |
  ## Personality

  **Dominant Traits:**
  [Key personality traits from responses]

  **Strengths:**
  - [Strength 1]
  - [Strength 2]

  **Weaknesses:**
  - [Weakness 1]
  - [Weakness 2]

  **Internal Contradictions (MINIMUM 5 REQUIRED):**

  > **🎯 CRITICAL REQUIREMENT — Based on AgentAdam vs BBB Analysis**
  >
  > AgentAdam requires **5+ contradictions per character** to create authentic psychological depth. Characters are interesting because they are contradictory.
  >
  > **Reference:** `_bmad-output/bmb-creations/analysis/agentadam-vs-bbb-comparison.md` (sections 2, 9, 10)
  >
  > **Types of contradictions to explore:**
  > 1. **Values vs Actions** — What do they believe vs what do they actually do?
  > 2. **Self-Image vs Reality** — How do they see themselves vs how are they?
  > 3. **Conscious vs Unconscious** — What they want vs what they actually need?
  > 4. **Idealism vs Pragmatism** — What principles vs what compromises?
  > 5. **Past vs Present** — Who were they vs who are they becoming?
  >
  > **For each contradiction:**
  > - Explain the tension
  > - Give examples of situations where it emerges
  > - Show how it affects relationships
  > - Connect it to the transformation arc

  - [Contradiction 1 - Values vs Actions: ...]
  - [Contradiction 2 - Self-Image vs Reality: ...]
  - [Contradiction 3 - Conscious vs Unconscious: ...]
  - [Contradiction 4 - Idealism vs Pragmatism: ...]
  - [Contradiction 5 - Past vs Present: ...]
  - [Contradiction 6+ - Other tensions identified: ...]

# Desires and fears section template
desires_fears_template: |
  ## Desires and Fears

  **What They Want (Conscious):**
  [What {characterName} thinks they want]

  **What They Want (Unconscious):**
  [What they ACTUALLY want — the deeper need]

  **Greatest Fears:**
  [The core fears that drive and limit them]

  **Blind Spots:**
  - [Blind spot 1]
  - [Blind spot 2]
  - [What they can't see about themselves]

# Arc section template
arc_template: |
  ## Transformation Arc

  **Starting Point:**
  [Who {characterName} is at the start — beliefs, emotional state, flaw/misapprehension]

  **Change Catalysts:**
  - [Inciting incident or disruption]
  - [Key challenges that force them to question themselves]
  - [The moment that breaks them open]

  **Transformation:**
  [Arc type — Growth/Fall/Flat/Transformation/Complex]
  [Journey of change — what they resist, what they release, point of no return]
  [What they learn, how they change, what it costs]

  **Ending Point:**
  [Who {characterName} becomes by the end — new beliefs, new worldview, what's different]
  [What remains unresolved]

  **Theme:**
  [What the arc is ABOUT — the human truth or question the story explores through this character]

# Thematic section template
themes_template: |
  ## Themes Explored

  **Main Contradictions:**
  [List the key contradictions that drive the character]

  **Central Question:**
  [What question does this character and their arc pose? What human truth does the story explore through them?]

  **Theme:**
  [The larger theme this character embodies or explores]


# Save the Cat Structure Template

frameworkStructure:
  name: "Save the Cat"
  type: "beat-sheet"
  totalBeats: 15
  acts: 4
  beats:
    - name: "Opening Image"
      purpose: "Set tone and show protagonist's current state"
      chapterTarget: 1
      act: "Setup"
    - name: "Theme Stated"
      purpose: "Hint at the central theme"
      chapterTarget: 1-2
      act: "Setup"
    - name: "Setup"
      purpose: "Introduce characters, stakes, and goal"
      chapterTarget: 1-5
      act: "Setup"
    - name: "Catalyst"
      purpose: "Inciting incident that disrupts status quo"
      chapterTarget: 2-3
      act: "Setup"
    - name: "Debate"
      purpose: "Protagonist hesitates, makes decision"
      chapterTarget: 3-5
      act: "Setup"
    - name: "Break into Two"
      purpose: "Protagonist leaves comfort zone"
      chapterTarget: 5-6
      act: "Response"
    - name: "B Story"
      purpose: "Introduction of secondary storyline"
      chapterTarget: 6-8
      act: "Response"
    - name: "Fun and Games"
      purpose: "Exploring the new world, core story"
      chapterTarget: 8-15
      act: "Response"
    - name: "Midpoint"
      purpose: "False victory or defeat, stakes raised"
      chapterTarget: 15-16
      act: "Attack"
    - name: "Bad Guys Close In"
      purpose: "Pressure builds, obstacles mount"
      chapterTarget: 16-18
      act: "Attack"
    - name: "All Is Lost"
      purpose: "Major defeat, seeming end"
      chapterTarget: 18-19
      act: "Attack"
    - name: "Dark Night of the Soul"
      purpose: "Moment of despair"
      chapterTarget: 19-20
      act: "Attack"
    - name: "Break into Three"
      purpose: "Realization, new hope"
      chapterTarget: 20-21
      act: "Resolution"
    - name: "Finale"
      purpose: "Climax, protagonist overcomes"
      chapterTarget: 21-24
      act: "Resolution"
    - name: "Final Image"
      purpose: "Contrast with opening, show transformation"
      chapterTarget: 24
      act: "Resolution"
